# "Kailash Parivar" (STORY.md section 9; characters/kailash/kailash.py; automation/kailash-episodes.json): 55-75 s
# realistic-cinematic Kailash family Shorts (Mahadev, Mata Parvati, Ganesh ji, Kartikeya ji, Nandi, Mushak, Narad ji),
# lip-synced, big Hinglish subtitles, a cover frame and the "फिर ... ने जो किया…" title formula.
# NO cron of its own: daily.yml calls this workflow after every evening-slot run (and for slot=kalyug dispatches), and it
# can be dispatched by hand. It does something only when the owner approved the pilot (automation/kailash-episodes.json
# "approved": true; the repo variable KAILASH=off pauses it) AND tomorrow has a kailash slot (scripts/day-plan.mjs: Mon/Thu/Sat
# and festival tie-in days; never movie or Chhath-override days; under the 3-Shorts cap it replaces the weekday
# day-status morning Short or Kalyug/Dadi-Chhotu, never a festival status, the evening darshan or a dawn bhajan).
# Steps: Claude writes tomorrow's spec from the chosen bank idea, edge-tts voices, ONE Kaggle session (sps-kailash on
# story/movie_kernel.py: FLUX frames with the anti-likeness negative prompt, 2 Wan clips, MuseTalk lip-sync, Whisper),
# render, then the QA GATE (`kailash.py qa`: deity names heard by Whisper, lip-sync share after the beard/blur reject
# gate, character consistency against the master sheet, 55-75 s). A failed gate publishes NOTHING and logs why in
# automation/published.md. Then YouTube private with publishAt <release> 08:00 (playlist "Kailash Parivar"), Facebook
# Reel scheduled (<= 90 s; meta.mjs makes a Page video above), Instagram Reel queued. Never starts a Kaggle session in
# 09:00-11:30 / 18:30-21:00 IST or below the daily Shorts' quota reserve (story/kalyug.py gate, shared).
name: Kailash Parivar

on:
  workflow_call:
    inputs:
      spec: { type: string, default: '' }
      dry_run: { type: boolean, default: false }
      kaggle_reuse: { type: boolean, default: false }
  workflow_dispatch:
    inputs:
      spec:
        description: An episode file, e.g. story/kailash/2026-11-23-kailash-dev-deepawali-tripurari.json (empty = tomorrow's episode)
        required: false
        default: ''
      dry_run:
        description: Make and check the episode (artifact), publish nothing
        type: boolean
        default: true
      kaggle_reuse:
        description: Render from the last finished sps-kailash Kaggle session (no new GPU session)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  kailash:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    concurrency:
      group: shyam-kailash
      cancel-in-progress: false
    env:
      FFMPEG_PATH: ffmpeg
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
      MEDIA_URL: https://shyam-premi-media.sk9836413.workers.dev
      MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
      KAILASH: ${{ vars.KAILASH }}
      KALYUG: ${{ vars.KALYUG }}
      EXTRA_UPLOAD_DAY: ${{ vars.EXTRA_UPLOAD_DAY }}
      W: story/kailash/work
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Due episode
        id: d
        run: |
          git fetch -q origin main && git checkout -q origin/main -- automation/log.md automation/published.md
          node scripts/series-due.mjs --series kailash --spec "${{ inputs.spec }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.d.outputs.mode == 'produce' || steps.d.outputs.mode == 'write'
        with:
          python-version: '3.12'

      - name: Kaggle window and quota
        id: gate
        if: steps.d.outputs.mode == 'produce' || steps.d.outputs.mode == 'write'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          [ "${{ inputs.kaggle_reuse }}" = true ] && { echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; }
          pip install -q 'kaggle>=2.2' six
          node animate/kaggle.mjs quota > "$RUNNER_TEMP/quota.json" || true
          python -I characters/kailash/kailash.py gate --quota "$RUNNER_TEMP/quota.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write the episode
        id: write
        if: steps.d.outputs.mode == 'write' && steps.gate.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/validate.mjs:*),Bash(ls:*)"
          prompt: |
            Write the next "Kailash Parivar" episode of Shyam Premi SN. Its release day (IST) is ${{ steps.d.outputs.release }} at 08:00.
            The idea is "${{ steps.d.outputs.idea }}" in automation/kailash-episodes.json (its title, cover, premise,
            resolution, moral, story_type and source; its "variant" and "style"). Follow automation/STORY.md section 9
            exactly (tone rules, title formula, cover, full = 55-75 s and 10-16 lines, "variant": "mini" = 25-40 s and 6-9
            lines, sources or the fiction label) and section 2 for accuracy. Copy the idea's "variant" and "style" into the
            spec: "style": "cute-3d" uses the cartoon cast in characters/kalyug/cast.json (mahadev, parvati, bal-ganesh;
            Bal Ganesh is never lip-synced), otherwise characters/kailash/cast.json. Lines follow STORY.md "Spoken style". Copy the shape of
            story/kailash/pilot-ep1.json. Write story/kailash/${{ steps.d.outputs.release }}-<topic>.json (slug
            ${{ steps.d.outputs.release }}-kailash-${{ steps.d.outputs.idea }}), make
            `node scripts/validate.mjs <that file>` pass, and change nothing else.

      - name: Spec
        id: spec
        if: steps.gate.outputs.go == 'true' && (steps.d.outputs.mode == 'produce' || steps.write.outcome == 'success')
        run: |
          f="${{ steps.d.outputs.file }}"
          [ -n "$f" ] || f=$(ls story/kailash/${{ steps.d.outputs.release }}-*.json 2>/dev/null | head -1)
          [ -n "$f" ] && [ -f "$f" ] || { echo "::error::No episode file for ${{ steps.d.outputs.release }}"; exit 1; }
          node scripts/validate.mjs --soft-topics "$f"
          node scripts/series-due.mjs --series kailash --spec "$f" > "$RUNNER_TEMP/due.json"
          for k in slug release publish_at; do echo "$k=$(node -p "require(process.env.RUNNER_TEMP + '/due.json').$k")" >> "$GITHUB_OUTPUT"; done
          echo "SLUG=$(node -p "require(process.env.RUNNER_TEMP + '/due.json').slug")" >> "$GITHUB_ENV"
          echo "F=$f" >> "$GITHUB_ENV"

      - name: Tools
        if: steps.spec.outcome == 'success'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libfribidi0 libraqm0 > /dev/null
          pip install -q edge-tts pillow numpy opencv-python-headless kokoro-onnx==0.6.1 soundfile==0.14.0 faster-whisper 'kaggle>=2.2' six

      # Gemini voices (voice/gemini_tts.py): takes cached across runs (a re-run never asks again), the Whisper
      # large-v3-turbo model for the per-line name pre-check cached too.
      - name: Cache Gemini voices + Whisper turbo
        if: steps.spec.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sps-gemini-tts
            ~/.cache/huggingface
          key: gemini-tts-${{ github.run_id }}
          restore-keys: gemini-tts-

      - name: Voices
        if: steps.spec.outcome == 'success'
        env:
          # Gemini voice per character (voice/gemini-voices.json); repo variable GEMINI_TTS=off = edge-tts only.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPS_GEMINI_TTS: ${{ vars.GEMINI_TTS || 'on' }}
        run: python -I characters/kailash/kailash.py voice --spec "$F" --out "$W/voice" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Kaggle (frames, clips, lip-sync, pronunciation check)
        id: kaggle
        if: steps.spec.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 130
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: kailash
        run: |
          [ -n "$KAGGLE_API_TOKEN" ] || { echo "::error::no KAGGLE_API_TOKEN secret"; exit 1; }
          if [ "${{ inputs.kaggle_reuse }}" = true ]; then
            node animate/kaggle.mjs fetch --to "$W/kaggle" | tee -a "$GITHUB_STEP_SUMMARY"
            node scripts/movie-qa.mjs "$W/kaggle/qa.json" >> "$GITHUB_STEP_SUMMARY" || true
            exit 0
          fi
          python -I characters/kailash/kailash.py dataset --spec "$F" --voice "$W/voice" --out animate/dataset --max-minutes 75
          node animate/kaggle.mjs upload
          node animate/kaggle.mjs lock --minutes 20 || echo "::warning::lock: another sps kernel still RUNNING/QUEUED after 20 min; pushing anyway (Kaggle allows 2)"
          node animate/kaggle.mjs push --queue-minutes 20 --retry-minutes 20
          node animate/kaggle.mjs wait --minutes 95 --queue-minutes 20 > "$RUNNER_TEMP/wait.json" || echo "::warning::Kaggle: $(cat "$RUNNER_TEMP/wait.json")"
          node animate/kaggle.mjs fetch --to "$W/kaggle" | tee "$RUNNER_TEMP/fetch.json"
          node scripts/movie-qa.mjs "$W/kaggle/qa.json" >> "$GITHUB_STEP_SUMMARY" || true
          python -I characters/kailash/kailash.py gpu --kaggle "$W/kaggle" | tee "$RUNNER_TEMP/gpu.json" | tee -a "$GITHUB_STEP_SUMMARY"
          ls "$W/kaggle/frames" | grep -q '^s0' || ls "$W/kaggle/clips" | grep -q '^s0' || { echo "::error::Kaggle made no frames"; exit 1; }

      - name: Render
        id: render
        if: steps.kaggle.outcome == 'success'
        run: |
          mkdir -p "$W/out/small"
          python -I characters/kailash/kailash.py keep --kaggle "$W/kaggle" --spec "$F"
          v="$W/voice"; [ -f "$W/kaggle/voice/voice.json" ] && v="$W/kaggle/voice"
          echo "V=$v" >> "$GITHUB_ENV"
          python -I characters/kailash/kailash.py render --spec "$F" --voice "$v" --kaggle "$W/kaggle" --out "$W/out/$SLUG.mp4" \
            --meta "$W/out/meta.json" --srt "$W/out/$SLUG.srt" --small "$W/out/small/$SLUG.mp4" | tee -a "$GITHUB_STEP_SUMMARY"

      # The publish gate: any failed check = nothing is uploaded (the reason is logged in published.md and the summary).
      - name: QA gate (Whisper deity names, lip-sync, character consistency, length)
        id: qa
        if: steps.render.outcome == 'success'
        continue-on-error: true
        run: python -I characters/kailash/kailash.py qa --spec "$F" --kaggle "$W/kaggle" --meta "$W/out/meta.json" --out "$W/out/qa-gate.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the video as an artifact (7 days)
        if: steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kailash-${{ env.SLUG }}
          path: |
            story/kailash/work/out/
            story/kailash/work/kaggle/qa.json
            story/kailash/work/kaggle/results*.json
          retention-days: 7
          compression-level: 0

      - name: Log the skip (QA failed)
        if: steps.qa.outcome == 'failure' && !inputs.dry_run && steps.spec.outputs.release != 'pilot'
        run: |
          why=$(node -p "require('./' + process.env.W + '/out/qa-gate.json').why.join('; ').slice(0, 400)" 2>/dev/null || echo "QA gate error")
          echo "::error::Kailash Parivar $SLUG not published: $why"
          echo "- $SLUG | skipped: QA gate ($why), $(TZ=Asia/Kolkata date '+%d %b %H:%M') IST" >> automation/published.md
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/published.md && git commit -qm "Kailash Parivar $SLUG skipped: QA gate"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done

      - name: Host
        id: host
        if: steps.qa.outcome == 'success'
        run: node scripts/publish.mjs --host-only --video "$W/out/small/$SLUG.mp4" --scenes "$F" | tee "$RUNNER_TEMP/host.json"

      - name: Claim the upload
        id: claim
        if: steps.qa.outcome == 'success' && !inputs.dry_run && steps.spec.outputs.release != 'pilot'
        run: node scripts/upload-guard.mjs claim --day "${{ steps.spec.outputs.release }}" --slot kailash --slug "$SLUG"

      - name: YouTube (public at 08:00 IST on the release day)
        id: yt
        if: steps.claim.outputs.go == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          node scripts/youtube.mjs upload --video "$W/out/$SLUG.mp4" --scenes "$F" --publish-at "${{ steps.spec.outputs.release }}T${{ steps.spec.outputs.publish_at }}" | tee "$RUNNER_TEMP/yt.json"
          grep -q '"status":"ok"' "$RUNNER_TEMP/yt.json"

      - name: Release the claim after a failed upload
        if: always() && steps.claim.outputs.go == 'true' && steps.yt.outcome != 'success'
        run: node scripts/upload-guard.mjs release --day "${{ steps.spec.outputs.release }}" --slot kailash --slug "$SLUG" --reason "YouTube ${{ steps.yt.outcome }}"

      - name: Facebook and Instagram (Graph API)
        id: meta
        if: steps.yt.outcome == 'success'
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          [ -n "$META_PAGE_TOKEN" ] || { echo "::notice::META_* secrets not set; YouTube only"; exit 0; }
          grep -q '"duplicate":true' "$RUNNER_TEMP/yt.json" && { echo "::notice::YouTube already had it (earlier run): no second Facebook/Instagram post"; exit 0; }
          fb=$(node scripts/fb.mjs flags --date "${{ steps.spec.outputs.release }}" --slot kailash || echo --no-fb)
          node scripts/meta.mjs short --video "$W/out/$SLUG.mp4" --scenes "$F" --video-url "$MEDIA_URL/m/$SLUG.mp4" \
            --publish-at "${{ steps.spec.outputs.release }}T${{ steps.spec.outputs.publish_at }}" $fb | tee "$RUNNER_TEMP/meta.json" || true

      - name: Record
        if: steps.yt.outcome == 'success'
        run: |
          mkdir -p story/published
          cp "$F" "story/published/$SLUG.json"
          rel="${{ steps.spec.outputs.release }}"
          yt=$(node -p "const y=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/yt.json', 'utf8')).youtube; y.url + ' (public at ' + y.publishAt + ')'")
          deity=$(node -p "require('./' + process.env.F).deity"); summary=$(node -p "require('./' + process.env.F).summary")
          echo "$rel | kailash | $SLUG | $deity | $summary" >> automation/log.md
          social=$(node -p "try { ' | social: ' + JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/meta.json', 'utf8')).summary } catch { '' }")
          gpu=$(node -p "try { require(process.env.RUNNER_TEMP + '/gpu.json').gpu_minutes + ' GPU min' } catch { 'GPU n/a' }")
          made=$(node -p "const m = require('./' + process.env.W + '/out/meta.json'); m.seconds + ' s, clips ' + m.animated_scenes.length + ', lip-sync ' + m.lip_lines + '/' + m.lipsync_expected")
          # variant (full / mini) and style (realistic / cute-3d) for the growth.md comparison
          vs=$(node -p "const s = require('./' + process.env.F); (s.variant || 'full') + ', ' + (s.style || 'realistic')")
          echo "- $SLUG | youtube: $yt | Kailash Parivar ($vs, $made, $gpu), made $(TZ=Asia/Kolkata date '+%d %b %H:%M') IST$social" >> automation/published.md
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/log.md automation/published.md "story/published/$SLUG.json" characters/kailash/clips characters/kalyug/clips "$F"
          git commit -qm "Kailash Parivar $SLUG scheduled for $rel 08:00"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
