# Shyam Premi SN: two story videos a day (YouTube Short + Instagram/Facebook reel via Make), plus one
# long katha video (16:9, 5-10 min, YouTube only, scheduled for 12:30 IST) made after the morning Short.
# Morning window 05:30-11:59 IST, evening window 17:30-22:59 IST. GitHub's schedule often fires hours
# late, so it is polled every 30 minutes inside both windows; the first run in a window publishes and the
# rest skip (slot already in automation/log.md). Runs outside a window do nothing, so nothing posts at night.
# Every Short is animated where Kaggle allows (morning: up to 4 marked scenes; see the Animate step). The evening darshan Short is animated (image-to-video on Kaggle's free GPU, ~66 min), so the scheduler Worker
# dispatches slot=evening at 10:43 IST and YouTube publishes it at 19:00 IST (publishAt); 18:46 IST is the retry.
# An explicit slot works at any hour. If Kaggle fails, times out or has under 10 GPU hours left this week, the
# scenes fall back to FLUX stills + zoompan: the post is never skipped.
# slot=noon (dispatched by the scheduler at 10:13 IST, retry 18:46 IST) is the daily "Dadi aur Chhotu" cartoon dialogue
# Short (STORY.md section 6, characters/): edge-tts voices, story images, lip-sync on Kaggle (~10-15 GPU-min), else the
# still two-shot with a speaker highlight. dry_run=true renders everything and keeps the video as an artifact only.
# Festival "WhatsApp status" Shorts (job `status`, story/status/<date>.json, written in advance): after every evening-slot
# run from 15:00 IST (the 18:46 IST retry dispatch, the evening schedule) the video for TOMORROW's festival is animated on Kaggle, rendered, hosted on
# the media Worker (download link in the description) and uploaded private with publishAt 06:00 IST on the festival day.
# slot=status (+ status_date) runs only that job; with dry_run it renders and hosts but never uploads or logs. The
# images and clips are cached per festival day, so a dry run's clips are reused by the real run.
# Real temple photos: before rendering, scripts/real-photos.mjs fetches licence-safe Wikimedia Commons photos for the
# spec's `temple` when footage/<temple>/ has none; the renderers show them on `real` scenes and credit them.
# Facebook + Instagram (scripts/meta.mjs, Graph API, never-expiring Page token in the META_PAGE_ID / META_PAGE_TOKEN / IG_USER_ID
# secrets; without them, or when Meta rejects the token, scripts/publish.mjs falls back to Make as before). Facebook Reels
# stop at 90 s, so a longer Short (Dadi aur Chhotu) is a normal Page video; Instagram Reels via the API take up to 15 min.
# Timing follows YouTube: morning and noon Shorts go out at once; the evening Short (19:00 IST) and the festival status
# Short (06:00 IST) are SCHEDULED on Facebook, and because Instagram has no scheduled publishing they are queued
# ("ig: pending <time>" in automation/published.md) and the `instagram` job, which runs on every trigger (no new cron),
# publishes them within 20 minutes of that time: the 18:46 IST evening dispatch waits for 19:00, the status Short goes
# out with the first run after 06:00 IST (the 05:47 IST schedule poll or the 09:13 IST morning dispatch), and a slot
# missed by over 6 hours is skipped. The long katha video is a normal Facebook Page video scheduled for 12:30 IST
# (in-stream ads later); it is not posted to Instagram.
name: Daily story video

on:
  schedule:
    - cron: '17,47 0-6 * * *'    # 05:47-12:17 IST
    - cron: '17,47 12-17 * * *'  # 17:47-23:17 IST
  workflow_dispatch:
    inputs:
      slot:
        description: morning, evening, noon, long or status (empty = by time of day; long = only the long video; noon = the Dadi aur Chhotu Short; status = only tomorrow's festival status Short)
        required: false
        default: ''
      dry_run:
        description: Render only (no YouTube, no Instagram/Facebook, nothing logged); the video becomes the run's artifact
        type: boolean
        default: false
      status_date:
        description: status slot only - festival day YYYY-MM-DD (empty = tomorrow in IST)
        required: false
        default: ''

permissions:
  contents: write

# Evening runs have their own queue, so the long animated evening job can run beside the morning one; within a
# slot, runs queue and the later one skips once the slot is in log.md. log.md and published.md merge as unions.
concurrency:
  group: ${{ inputs.slot == 'noon' && 'daily-story-noon' || inputs.slot == 'status' && 'daily-story-status' || ((inputs.slot == 'evening' || github.event.schedule == '17,47 12-17 * * *') && 'daily-story-evening' || 'daily-story') }}
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    outputs:
      # The long video job runs after every morning-slot run (and for slot=long); it skips once done.
      long: ${{ steps.date.outputs.long }}
      # The festival status job runs after every evening-slot run (and for slot=status); it skips once scheduled.
      status: ${{ steps.date.outputs.status }}
    timeout-minutes: 230
    env:
      FFMPEG_PATH: ffmpeg
      PYTHON: python
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
      SUB_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      # The media Worker runs FLUX and hosts the videos, so no Cloudflare API token is needed.
      MEDIA_URL: https://shyam-premi-media.sk9836413.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Date and slot
        id: date
        run: |
          # A queued run may have been triggered before the previous one recorded its slot: use the latest log.
          git fetch -q origin main && git checkout -q origin/main -- automation/log.md
          today=$(TZ=Asia/Kolkata date +%F)
          slot="${{ inputs.slot }}"
          if [ "$slot" = long ]; then
            echo "long=true" >> "$GITHUB_OUTPUT"; echo "done=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Long video only"; exit 0
          fi
          if [ "$slot" = status ]; then
            echo "status=true" >> "$GITHUB_OUTPUT"; echo "done=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Festival status video only"; exit 0
          fi
          if [ -z "$slot" ]; then
            hm=$((10#$(TZ=Asia/Kolkata date +%H%M)))
            if [ $hm -ge 530 ] && [ $hm -lt 1200 ]; then slot=morning
            elif [ $hm -ge 1730 ] && [ $hm -lt 2300 ]; then slot=evening
            else
              echo "::notice::Outside the posting windows ($hm IST)"
              echo "done=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          if [ "$slot" = morning ]; then echo "long=true" >> "$GITHUB_OUTPUT"; fi
          # Tomorrow's festival status Short: only on evening runs from 15:00 IST (the 18:46 IST retry dispatch and the
          # evening schedule), so it never competes with the evening Short for the Kaggle GPU (10:43 IST dispatch) and
          # can be dry-run during the day first.
          if [ "$slot" = evening ] && [ $((10#$(TZ=Asia/Kolkata date +%H))) -ge 15 ]; then echo "status=true" >> "$GITHUB_OUTPUT"; fi
          if grep -q "^$today | $slot |" automation/log.md; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$today $slot already published"
          fi

      - uses: actions/setup-node@v4
        if: steps.date.outputs.done != 'true'
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: steps.date.outputs.done != 'true'
        with:
          python-version: '3.12'

      - name: Tools
        if: steps.date.outputs.done != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q kokoro-onnx==0.6.1 soundfile==0.14.0 edge-tts

      - name: Cache Kokoro model
        if: steps.date.outputs.done != 'true'
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-v1.0

      - name: Download Kokoro model
        if: steps.date.outputs.done != 'true'
        run: |
          mkdir -p .kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f .kokoro/kokoro-v1.0.onnx ] || curl -sSL -o .kokoro/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f .kokoro/voices-v1.0.bin ] || curl -sSL -o .kokoro/voices-v1.0.bin $base/voices-v1.0.bin

      # Daily trend research (scripts/trend-signals.mjs): YouTube autocomplete (Roman + Devanagari seeds), Google Trends
      # India and the channel's own numbers -> automation/trends/<date>.md with ranked topics for the next 3 days, read by
      # every slot's story prompt (STORY.md section 1). Once a day, on the morning run only; a file already committed
      # today is reused. Committed by the Record step. Free endpoints; any failure leaves the story as before.
      - name: Trend research
        if: steps.date.outputs.done != 'true' && steps.date.outputs.slot == 'morning'
        continue-on-error: true
        timeout-minutes: 10
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SHYAM_YT_CLIENT_ID: ${{ secrets.SHYAM_YT_CLIENT_ID }}
          SHYAM_YT_CLIENT_SECRET: ${{ secrets.SHYAM_YT_CLIENT_SECRET }}
          SHYAM_YT_REFRESH_TOKEN: ${{ secrets.SHYAM_YT_REFRESH_TOKEN }}
        run: |
          git checkout -q origin/main -- automation/trends 2>/dev/null || true
          node scripts/trend-signals.mjs --date "${{ steps.date.outputs.today }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write the story
        if: steps.date.outputs.done != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/validate.mjs:*),Bash(ls:*)"
          prompt: |
            Write today's Shyam Premi SN story video. Today's date (IST) is ${{ steps.date.outputs.today }}, slot: ${{ steps.date.outputs.slot }}.
            Follow automation/STORY.md exactly${{ steps.date.outputs.slot == 'noon' && ' (the noon slot is the "Dadi aur Chhotu" dialogue Short: section 6)' || '' }}.
            Today's trend research is automation/trends/${{ steps.date.outputs.today }}.md (if it is missing, the newest file in
            automation/trends/): read its first 100 lines and use it as STORY.md section 1 says.
            Write story/today/scenes.json, make scripts/validate.mjs pass,
            and append one line to automation/log.md. Change nothing else.

      - name: Validate
        if: steps.date.outputs.done != 'true'
        run: |
          node scripts/validate.mjs story/today/scenes.json
          slug=$(node -p "require('./story/today/scenes.json').slug")
          case "$slug" in "${{ steps.date.outputs.today }}-${{ steps.date.outputs.slot }}-"*) ;; *) echo "::error::Unexpected slug $slug"; exit 1;; esac
          grep -q "^${{ steps.date.outputs.today }} | ${{ steps.date.outputs.slot }} |" automation/log.md || { echo "::error::log.md line missing"; exit 1; }
          echo "SLUG=$slug" >> "$GITHUB_ENV"

      # Daily Veo kit (scripts/veo-kit.mjs): YouTube's own AI video tool (Veo in the YouTube app) has no API, so a person
      # makes 1-2 hero Shorts by hand. 2 ideas (festival, then today's trends file, then Khatu Shyam ji; never one of today's
      # slots, so it runs after the morning story is in log.md, even if that failed), 3 FLUX / licence-safe real photos
      # each (6 images), Veo prompts, titles and captions -> /kit/<date>.html on the media Worker, an email (RESEND_API_KEY),
      # a CRM task (INGEST_TOKEN) and this run's summary. Once a day (skips if the kit exists); never blocks the post.
      - name: Veo kit
        if: ${{ !cancelled() && steps.date.outputs.done != 'true' && steps.date.outputs.slot == 'morning' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node scripts/veo-kit.mjs --date "${{ steps.date.outputs.today }}"

      # Real temple photos (Wikimedia Commons, CC0 / PD / CC BY only, exact temple only) for the spec's `temple`, fetched
      # once when footage/<temple>/ has none (searched at most every 30 days); committed with the Record step.
      - name: Real temple photos
        if: steps.date.outputs.done != 'true'
        continue-on-error: true
        run: node scripts/real-photos.mjs --spec story/today/scenes.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Every Short is animated: evening/noon up to 4 scenes, morning the (up to 4) scenes marked `animate`, become
      # real clips of their scene's length (Wan 2.2 TI2V-5B on the private Kaggle kernel sps-animate-<slot>, T4 x2), then
      # an automatic check rejects face drift, flicker and colour streaks. One session at a time (lock); a session still
      # queued after 20 min, a failure or a timeout leaves the zoompan stills. Quota guard: morning needs 5 GPU hours
      # left this week, evening/noon 3.
      # Quality (animate/REPORT.md section 10): the kernel also makes the evening's hero darshan clip with Wan 2.2
      # I2V-A14B (only while >= 6 GPU hours are left), RIFE-interpolates every clip to 30 fps and upscales clips (1080 px)
      # and stills (2160 px) with Real-ESRGAN. Every part falls back to the old path; repo variables SPS_ENHANCE=0 /
      # SPS_HERO14B=0 switch one off, SPS_FLUX=1 also re-makes the start frames with FLUX.1-schnell on the GPU (+7.7 min).
      - name: Animate (Kaggle GPU)
        id: anim
        if: steps.date.outputs.done != 'true' && contains(fromJSON('["morning","evening"]'), steps.date.outputs.slot)
        continue-on-error: true
        timeout-minutes: 170
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: ${{ steps.date.outputs.slot }}
          MIN_HOURS: ${{ steps.date.outputs.slot == 'morning' && '5' || '3' }}
          LOCK_MINUTES: ${{ steps.date.outputs.slot == 'evening' && '45' || '15' }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          SPS_FLUX: ${{ vars.SPS_FLUX }}
          SPS_ENHANCE: ${{ vars.SPS_ENHANCE }}
          SPS_HERO14B: ${{ vars.SPS_HERO14B }}
        run: |
          fail() { echo "::warning::Animation skipped, using zoompan: $1"; echo "- Animation skipped: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ -n "$KAGGLE_API_TOKEN" ] || fail "no KAGGLE_API_TOKEN secret"
          pip install -q 'kaggle>=2.2' six || fail "kaggle CLI install failed"
          node animate/kaggle.mjs quota --min "$MIN_HOURS" > "$RUNNER_TEMP/quota.json" || fail "under $MIN_HOURS Kaggle GPU hours left this week ($(cat "$RUNNER_TEMP/quota.json"))"
          left=$(node -p "Math.floor(require(process.env.RUNNER_TEMP + '/quota.json').left || 0)")
          [ "$left" -ge 6 ] || export SPS_HERO14B=0
          node story/render-story.mjs story/today/scenes.json --prepare || fail "FLUX images / narration failed"
          plan="story/today/build/$SLUG/plan.json"
          node animate/kaggle.mjs prepare story/today/scenes.json --plan "$plan" --max 4 ${{ vars.SHYAM_TTS == 'chatterbox' && '--voice' || '' }} || fail "dataset upload failed"
          node animate/kaggle.mjs lock --minutes "$LOCK_MINUTES" || fail "another sps-animate kernel is still running after $LOCK_MINUTES min"
          node animate/kaggle.mjs push --queue-minutes 20 --retry-minutes "$LOCK_MINUTES" || fail "kernel push failed (Kaggle busy?)"
          start=$(date +%s)
          node animate/kaggle.mjs wait --minutes 115 --queue-minutes 20 > "$RUNNER_TEMP/wait.json" || echo "::warning::Kaggle: $(cat "$RUNNER_TEMP/wait.json"); using any clips it finished"
          grep -q QUEUED_TOO_LONG "$RUNNER_TEMP/wait.json" && fail "the Kaggle GPU session was still queued after 20 min"
          node animate/kaggle.mjs fetch --to story/today/clips --voice-to story/today/voice --stills-to story/today/stills > "$RUNNER_TEMP/fetch.json" || fail "could not download the clips"
          echo "- Kaggle: $(cat "$RUNNER_TEMP/fetch.json"), waited $(( ($(date +%s) - start) / 60 )) min, quota before: $(cat "$RUNNER_TEMP/quota.json")" >> "$GITHUB_STEP_SUMMARY"
          node animate/check-clips.mjs story/today/scenes.json --clips story/today/clips --plan "$plan" --stills story/today/stills --summary "$GITHUB_STEP_SUMMARY"

      # Noon: the "Dadi aur Chhotu" dialogue Short (STORY.md section 6; characters/dialogue.py, characters/README.md).
      # Voices (edge-tts, pauses between turns) and 3-6 FLUX story images are made here.
      - name: Characters (voices, story images, shot plan)
        if: steps.date.outputs.done != 'true' && steps.date.outputs.slot == 'noon'
        env:
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
        run: |
          pip install -q pillow
          c="python -I characters/dialogue.py"; d=story/today/char
          $c voice --spec story/today/scenes.json --channel shyam --out $d/voice | tee -a "$GITHUB_STEP_SUMMARY"
          $c images --spec story/today/scenes.json --out $d/images
          $c plan --spec story/today/scenes.json --channel shyam --voice $d/voice --out $d/plan.json

      # Lip-sync on Kaggle (private kernel sps-char-shyam, MuseTalk 1.5 on the canonical clip library, T4 x2, ~10-15 min),
      # after the morning job's session (same lock: one sps kernel at a time). No secret, under 2 GPU hours left, a busy
      # account or any failure: the renderer uses the still two-shot with a speaker highlight for the missing lines.
      - name: Lip-sync (Kaggle GPU)
        if: steps.date.outputs.done != 'true' && steps.date.outputs.slot == 'noon'
        continue-on-error: true
        timeout-minutes: 110
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: char-shyam
        run: |
          fail() { echo "::warning::Lip-sync skipped, using stills: $1"; echo "- Lip-sync skipped: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ -n "$KAGGLE_API_TOKEN" ] || fail "no KAGGLE_API_TOKEN secret"
          pip install -q 'kaggle>=2.2' six || fail "kaggle CLI install failed"
          node animate/kaggle.mjs quota --min 2 > "$RUNNER_TEMP/quota.json" || fail "under 2 Kaggle GPU hours left this week ($(cat "$RUNNER_TEMP/quota.json"))"
          python -I characters/dialogue.py dataset --plan story/today/char/plan.json --voice story/today/char/voice --out animate/dataset --max-minutes 30 || fail "dataset build failed"
          node animate/kaggle.mjs upload || fail "dataset upload failed"
          node animate/kaggle.mjs lock --minutes 40 || fail "another sps kernel was still running after 40 min"
          node animate/kaggle.mjs push --queue-minutes 20 --retry-minutes 20 || fail "kernel push failed (Kaggle busy?)"
          start=$(date +%s)
          node animate/kaggle.mjs wait --minutes 45 --queue-minutes 20 > "$RUNNER_TEMP/wait.json" || echo "::warning::Kaggle: $(cat "$RUNNER_TEMP/wait.json"); using any lines it finished"
          grep -q QUEUED_TOO_LONG "$RUNNER_TEMP/wait.json" && fail "the Kaggle GPU session was still queued after 20 min"
          node animate/kaggle.mjs fetch --to story/today/char/lipsync > "$RUNNER_TEMP/fetch.json" || fail "could not download the lip-sync clips"
          echo "- Lip-sync: $(node characters/summary.mjs "$RUNNER_TEMP/fetch.json") (waited $(( ($(date +%s) - start) / 60 )) min; quota before: $(cat "$RUNNER_TEMP/quota.json"))" >> "$GITHUB_STEP_SUMMARY"

      # Narration: edge-tts hi-IN-MadhurNeural. Only when the repo variable SHYAM_TTS is "chatterbox" does the Kaggle
      # session also narrate with Chatterbox (story/today/voice), used when every line succeeded. Off since the 4 Nov
      # A/B: Chatterbox said "Shaam" for Shyam and "Ganej" for Ganesh (animate/REPORT.md section 9).
      - name: Render
        if: steps.date.outputs.done != 'true'
        env:
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          VOICE_DIR: story/today/voice
        run: |
          if [ "${{ steps.date.outputs.slot }}" = noon ]; then
            d=story/today/char; mkdir -p story/today/out
            python -I characters/dialogue.py render --spec story/today/scenes.json --channel shyam --plan $d/plan.json --voice $d/voice \
              --lipsync $d/lipsync --images $d/images --out "story/today/out/$SLUG.mp4" --meta $d/meta.json --credits | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node story/render-story.mjs story/today/scenes.json
          fi

      - name: Keep the dry-run video (7 days)
        if: inputs.dry_run && steps.date.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ steps.date.outputs.slot }}
          path: |
            story/today/out/
            story/today/scenes.json
            story/today/char/meta.json
            story/today/char/plan.json
          retention-days: 7
          compression-level: 0

      - name: Festival links
        if: steps.date.outputs.done != 'true'
        continue-on-error: true
        run: node scripts/festival-links.mjs story/today/scenes.json

      - name: YouTube
        id: yt
        continue-on-error: true
        if: steps.date.outputs.done != 'true' && !inputs.dry_run
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        # The evening Short is made hours early, so YouTube publishes it at 19:00 IST (straight away if later).
        run: node scripts/youtube.mjs upload --video "story/today/out/$SLUG.mp4" --scenes story/today/scenes.json ${{ steps.date.outputs.slot == 'evening' && '--publish-at 19:00' || '' }} | tee "$RUNNER_TEMP/yt.json"

      - name: Instagram and Facebook (Graph API, Make fallback)
        id: make
        continue-on-error: true
        if: steps.date.outputs.done != 'true' && !inputs.dry_run
        env:
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        # Evening: Facebook scheduled for 19:00 IST like YouTube, Instagram queued for the `instagram` job.
        run: node scripts/publish.mjs --video "story/today/out/$SLUG.mp4" --scenes story/today/scenes.json ${{ steps.date.outputs.slot == 'evening' && '--publish-at 19:00' || '' }} | tee "$RUNNER_TEMP/make.json"

      - name: Record
        # Only once something was published, so a failed render is retried by the next slot run.
        if: always() && env.SLUG != '' && (steps.yt.outcome == 'success' || steps.make.outcome == 'success')
        run: |
          mkdir -p story/published
          cp story/today/scenes.json "story/published/$SLUG.json"
          yt=$(node -p "try{const y=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/yt.json','utf8')).youtube;y.url+(y.publishAt?' (public at '+y.publishAt+')':'')}catch{''}")
          anim=$(node characters/summary.mjs --record)
          echo "- $SLUG | youtube: ${yt:-failed} | social: $(node -p "try{const j=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/make.json','utf8'));j.summary||j.status}catch{'failed'}")$anim" >> automation/published.md
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/log.md automation/calendar.md automation/published.md "story/published/$SLUG.json" footage
          [ -d automation/trends ] && git add automation/trends
          git commit -qm "Story $SLUG"
          git pull -q --rebase && git push -q

      - name: Fail if a platform failed
        if: steps.yt.outcome == 'failure' || steps.make.outcome == 'failure'
        run: |
          echo "::error::YouTube: ${{ steps.yt.outcome }}, Make: ${{ steps.make.outcome }}"
          exit 1

  # Daily long katha video (automation/STORY.md section 5): 16:9, 5-10 min, YouTube only, private with
  # publishAt 12:30 IST. Runs after the morning Short (whatever its result) or alone with slot=long, so the
  # Shorts never wait for it or fail because of it. Story and images are cached per day, so a retry costs no
  # extra neurons; after 3 failed attempts it waits for the next day. If the upload fails (quotaExceeded or
  # an error) the mp4 is parked on the media Worker and the next run retries it (scripts/long-pending.mjs).
  long:
    needs: story
    if: always() && needs.story.outputs.long == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      FFMPEG_PATH: ffmpeg
      PYTHON: python
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
      SUB_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      MEDIA_URL: https://shyam-premi-media.sk9836413.workers.dev
      MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      # Dormant: a separate Google project's OAuth client, used only if all three secrets are ever set.
      SHYAM_YT_CLIENT_ID: ${{ secrets.SHYAM_YT_CLIENT_ID }}
      SHYAM_YT_CLIENT_SECRET: ${{ secrets.SHYAM_YT_CLIENT_SECRET }}
      SHYAM_YT_REFRESH_TOKEN: ${{ secrets.SHYAM_YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Git identity
        run: |
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Retry a pending upload
        continue-on-error: true
        run: |
          [ -s automation/long-pending.md ] || { echo "Nothing pending"; exit 0; }
          node scripts/long-pending.mjs retry | tee "$RUNNER_TEMP/retry.json"
          if ! git diff --quiet automation; then
            git add automation && git commit -qm "Long video upload retry" && git pull -q --rebase && git push -q
          fi

      - name: Date
        id: date
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if grep -q "^$today | long |" automation/log.md; then
            echo "::notice::$today long video already made"
          else
            echo "GO=1" >> "$GITHUB_ENV"
          fi

      - name: Restore today's story and images
        if: env.GO == '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            story/long/scenes.json
            story/long/images
            story/long/tries
          key: long-${{ steps.date.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: long-${{ steps.date.outputs.today }}-

      - name: Attempts
        id: tries
        if: env.GO == '1'
        run: |
          mkdir -p story/long
          n=$(( $(cat story/long/tries 2>/dev/null || echo 0) + 1 ))
          echo $n > story/long/tries
          if [ $n -gt 3 ]; then
            echo "::warning::The long video failed 3 times today; trying again tomorrow"
            echo "GO=0" >> "$GITHUB_ENV"; exit 0
          fi
          # A story written by an earlier attempt today is reused, with its cached images.
          if [ -f story/long/scenes.json ] && node -e "process.exit(require('./story/long/scenes.json').slug.startsWith('${{ steps.date.outputs.today }}-long-') ? 0 : 1)"; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf story/long/scenes.json story/long/images
          fi

      - uses: actions/setup-python@v5
        if: env.GO == '1'
        with:
          python-version: '3.12'

      - name: Tools
        if: env.GO == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q kokoro-onnx==0.6.1 soundfile==0.14.0 edge-tts

      - name: Cache Kokoro model
        if: env.GO == '1'
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-v1.0

      - name: Download Kokoro model
        if: env.GO == '1'
        run: |
          mkdir -p .kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f .kokoro/kokoro-v1.0.onnx ] || curl -sSL -o .kokoro/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f .kokoro/voices-v1.0.bin ] || curl -sSL -o .kokoro/voices-v1.0.bin $base/voices-v1.0.bin

      - name: Write the long story
        if: env.GO == '1' && steps.tries.outputs.have != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/validate.mjs:*),Bash(ls:*),Bash(mkdir -p story/long)"
          prompt: |
            Write today's Shyam Premi SN LONG katha video. Today's date (IST) is ${{ steps.date.outputs.today }}, slot: long.
            Follow automation/STORY.md exactly: sections 1-2 for choosing and researching the subject, and section 5
            "Long video" for everything else. Today's trend research is automation/trends/${{ steps.date.outputs.today }}.md
            (if it is missing, the newest file in automation/trends/): read its first 100 lines and prefer a "long part" topic
            from it when it fits the section 5 subject order. Write story/long/scenes.json and make
            `node scripts/validate.mjs story/long/scenes.json` pass. You may add confirmed festivals to
            automation/calendar.md. Change nothing else (do not edit automation/log.md: the workflow records it).
            Use the Write tool for the file (the directory story/long already exists); shell commands other than
            the validator and ls are not available.

      # When the story is missing, show Claude's own words and any refused tool calls (no tool output) so
      # the cause can be fixed without exposing anything else in this public log.
      - name: Why is the story missing
        if: env.GO == '1' && steps.tries.outputs.have != 'true' && hashFiles('story/long/scenes.json') == ''
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          [ -f "$f" ] && node -e '
            const msgs = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            for (const m of msgs) {
              if (m.type === "result") console.log("DENIED:", JSON.stringify((m.permission_denials || []).map((d) => ({ tool: d.tool_name, input: String(JSON.stringify(d.tool_input)).slice(0, 160) }))));
              if (m.type !== "assistant") continue;
              for (const c of m.message?.content || []) {
                if (c.type === "text") console.log("SAID:", c.text.slice(0, 400));
                if (c.type === "tool_use") console.log("TOOL:", c.name, String(c.input?.file_path || c.input?.command || "").slice(0, 120));
              }
            }' "$f"
          echo "::error::Claude did not write story/long/scenes.json"; exit 1

      - name: Validate
        if: env.GO == '1'
        run: |
          node scripts/validate.mjs --long story/long/scenes.json
          slug=$(node -p "require('./story/long/scenes.json').slug")
          case "$slug" in "${{ steps.date.outputs.today }}-long-"*) ;; *) echo "::error::Unexpected slug $slug"; exit 1;; esac
          echo "SLUG=$slug" >> "$GITHUB_ENV"

      - name: Real temple photos
        if: env.GO == '1'
        continue-on-error: true
        run: node scripts/real-photos.mjs --spec story/long/scenes.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Chatterbox narration for the long video on the Kaggle GPU (kernel sps-tts-long, ~5 min for 5-6 min of speech),
      # only when the repo variable SHYAM_TTS is "chatterbox" (off: see the Render note in the story job).
      # Any failure, a busy Kaggle or under 3 GPU hours left: edge-tts makes the voice in the Render step instead.
      - name: Voice (Kaggle GPU)
        if: env.GO == '1' && vars.SHYAM_TTS == 'chatterbox'
        continue-on-error: true
        timeout-minutes: 60
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: long
        run: |
          fail() { echo "::warning::Chatterbox voice skipped, using edge-tts: $1"; exit 1; }
          [ -n "$KAGGLE_API_TOKEN" ] || fail "no KAGGLE_API_TOKEN secret"
          pip install -q 'kaggle>=2.2' six || fail "kaggle CLI install failed"
          node animate/kaggle.mjs quota --min 3 > "$RUNNER_TEMP/quota.json" || fail "under 3 Kaggle GPU hours left ($(cat "$RUNNER_TEMP/quota.json"))"
          node animate/kaggle.mjs prepare story/long/scenes.json --voice --max 0 || fail "dataset upload failed"
          node animate/kaggle.mjs lock --minutes 15 || fail "another sps kernel is still running"
          node animate/kaggle.mjs push --queue-minutes 15 --retry-minutes 15 || fail "kernel push failed (Kaggle busy?)"
          node animate/kaggle.mjs wait --minutes 40 --queue-minutes 15 > "$RUNNER_TEMP/wait.json" || fail "Kaggle: $(cat "$RUNNER_TEMP/wait.json")"
          node animate/kaggle.mjs fetch --to story/long/clips --voice-to story/long/voice | tee "$RUNNER_TEMP/fetch.json"
          echo "- Long voice: $(cat "$RUNNER_TEMP/fetch.json")" >> "$GITHUB_STEP_SUMMARY"

      - name: Render
        id: render
        if: env.GO == '1'
        env:
          VOICE_DIR: story/long/voice
        run: node story/render-long.mjs story/long/scenes.json

      - name: Save today's story and images
        if: always() && env.GO == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            story/long/scenes.json
            story/long/images
            story/long/tries
          key: long-${{ steps.date.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the video as an artifact (7 days)
        if: steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: long-${{ env.SLUG }}
          path: story/long/out/
          retention-days: 7
          compression-level: 0

      - name: YouTube
        id: yt
        if: steps.render.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/youtube.mjs upload --long --video "story/long/out/$SLUG.mp4" --scenes story/long/scenes.json \
            --meta "story/long/out/$SLUG.json" --thumbnail "story/long/out/$SLUG-thumb.jpg" --publish-at 12:30 | tee "$RUNNER_TEMP/yt.json"

      # The same video as a normal Facebook Page video (not a Reel), scheduled for 12:30 IST like YouTube; its line in
      # published.md is committed by Record. Never fails the job; skipped without the META_* secrets.
      - name: Facebook Page video (Graph API)
        if: steps.render.outcome == 'success'
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          [ -n "$META_PAGE_TOKEN" ] || { echo "::notice::META_* secrets not set; no Facebook copy"; exit 0; }
          node scripts/meta.mjs long --video "story/long/out/$SLUG.mp4" --scenes story/long/scenes.json --meta "story/long/out/$SLUG.json" \
            --thumbnail "story/long/out/$SLUG-thumb.jpg" --publish-at 12:30 | tee "$RUNNER_TEMP/fb.json" || true
          echo "- $SLUG | facebook: $(node -p "try{const j=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/fb.json','utf8'));j.facebook?j.facebook.url+(j.facebook.scheduled?' (scheduled '+j.facebook.scheduled+')':''):'error '+(j.error||j.status)}catch{'failed'}")" >> automation/published.md
          grep -q '"status":"ok"' "$RUNNER_TEMP/fb.json" || echo "::warning::Facebook Page video failed: $(head -c 300 "$RUNNER_TEMP/fb.json")"

      - name: Park the video for a retry
        if: steps.yt.outcome == 'failure'
        continue-on-error: true
        run: |
          reason=$(node -p "try{const j=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/yt.json','utf8'));(j.status==='quota'?'quota: ':'')+(j.error||'failed')}catch{'failed'}")
          node scripts/long-pending.mjs keep "$SLUG" "$reason"

      - name: Record
        if: always() && steps.render.outcome == 'success'
        run: |
          mkdir -p story/published
          cp story/long/scenes.json "story/published/$SLUG.json"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('story/long/out/$SLUG.json','utf8'));delete m.video;delete m.thumbnail;fs.writeFileSync('story/published/$SLUG.meta.json',JSON.stringify(m,null,2)+'\n')"
          line=$(node -e "
            const fs=require('fs'); const s=require('./story/long/scenes.json'); const m=require('./story/long/out/$SLUG.json');
            let y={}; try { y=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/yt.json','utf8')); } catch {}
            const len=Math.floor(m.seconds/60)+':'+String(Math.floor(m.seconds%60)).padStart(2,'0');
            const yt=y.youtube ? y.youtube.url+(y.youtube.publishAt?' (public at 12:30 IST)':'')+(y.youtube.thumbnailError?' (thumbnail failed: '+y.youtube.thumbnailError.slice(0,80)+')':'') : 'pending, retried next run ('+(y.status||'failed')+')';
            const out={log:'${{ steps.date.outputs.today }} | long | '+s.slug+' | '+s.deity+' | '+s.summary,
              pub:'- '+s.slug+' | youtube: '+yt+' | long '+len+', '+m.scenes+' scenes, render '+Math.round(m.render_seconds/60)+' min, '+m.neurons+' neurons',
              sum:'### Long video '+s.slug+'\n\n- Length: '+len+' ('+m.scenes+' scenes, '+m.chapters.length+' chapters)\n- Render: '+m.render_seconds+' s\n- Images: '+m.images+' ('+m.images_generated+' generated, ~'+m.neurons+' neurons)\n- YouTube: '+yt+'\n- Artifact: long-'+s.slug+' (7 days)\n'};
            fs.writeFileSync(process.env.RUNNER_TEMP+'/sum.md', out.sum); console.log(JSON.stringify(out));")
          echo "$line" | node -e "const o=JSON.parse(require('fs').readFileSync(0,'utf8'));require('fs').appendFileSync('automation/log.md',o.log+'\n');require('fs').appendFileSync('automation/published.md',o.pub+'\n')"
          cat "$RUNNER_TEMP/sum.md" >> "$GITHUB_STEP_SUMMARY"
          git add automation "story/published/$SLUG.json" "story/published/$SLUG.meta.json" footage
          git commit -qm "Long $SLUG"
          git pull -q --rebase && git push -q

      - name: Report a failed upload
        if: steps.yt.outcome == 'failure'
        run: |
          if grep -q '"status":"quota"' "$RUNNER_TEMP/yt.json" 2>/dev/null; then
            echo "::warning::YouTube quota exceeded: the video is parked on the media Worker and retried next run"
          else
            echo "::error::YouTube upload failed: $(cat "$RUNNER_TEMP/yt.json" 2>/dev/null)"; exit 1
          fi

  # Festival "WhatsApp status" Short (story/status/<date>.json; checked by scripts/validate.mjs): 15-30 s vertical darshan
  # with a big Hindi blessing, a well-known mantra where there is one, the logo and the end line "Apne parivaar ko
  # bhejein 🙏 | Subscribe: Shyam Premi SN". No 06:00 IST trigger exists (the scheduler's crons are fixed), so it is made
  # the evening BEFORE the festival, after the evening slot's run, and YouTube publishes it at 06:00 IST (publishAt),
  # when people set their morning status. The mp4 is also hosted on the media Worker (7 days) and its direct link goes
  # into the description so viewers can download it and set it as their status.
  status:
    needs: story
    if: always() && needs.story.outputs.status == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      FFMPEG_PATH: ffmpeg
      PYTHON: python
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
      SUB_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      MEDIA_URL: https://shyam-premi-media.sk9836413.workers.dev
      MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
      W: story/status/work
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Festival day
        id: d
        run: |
          git fetch -q origin main && git checkout -q origin/main -- automation/log.md
          day="${{ inputs.status_date }}"
          [ -n "$day" ] || day=$(TZ=Asia/Kolkata date -d tomorrow +%F)
          f="story/status/$day.json"
          [ -f "$f" ] || { echo "::notice::No festival status video planned for $day"; exit 0; }
          if grep -q "^$day | status |" automation/log.md && [ "${{ inputs.dry_run }}" != true ]; then
            echo "::notice::The $day status video is already scheduled"; exit 0
          fi
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "GO=1" >> "$GITHUB_ENV"
          echo "SLUG=$(node -p "require('./$f').slug")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: env.GO == '1'
        with:
          node-version: 22

      - name: Restore the day's images and clips
        if: env.GO == '1'
        uses: actions/cache/restore@v4
        with:
          path: story/status/work
          key: status-${{ steps.d.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: status-${{ steps.d.outputs.day }}-

      # The checked-in spec is the source of truth; accepted clips from an earlier run (e.g. the dry run) are kept when
      # their scene's prompt is unchanged.
      - name: Spec
        if: env.GO == '1'
        run: |
          mkdir -p "$W"
          node -e '
            const fs = require("fs"), [src, dst] = process.argv.slice(1);
            const spec = JSON.parse(fs.readFileSync(src, "utf8"));
            let old = null; try { old = JSON.parse(fs.readFileSync(dst, "utf8")); } catch {}
            let kept = 0;
            if (old && old.slug === spec.slug) spec.scenes.forEach((sc, i) => {
              const o = old.scenes[i];
              if (o && o.video && o.prompt === sc.prompt && fs.existsSync(require("path").join(require("path").dirname(dst), o.video))) { sc.video = o.video; kept++; }
            });
            fs.writeFileSync(dst, JSON.stringify(spec, null, 2) + "\n");
            console.log(JSON.stringify({ slug: spec.slug, clips_kept: kept }));
            if (kept) fs.appendFileSync(process.env.GITHUB_ENV, "HAVE_CLIPS=1\n");' "story/status/${{ steps.d.outputs.day }}.json" "$W/scenes.json"
          node scripts/validate.mjs "$W/scenes.json"

      - uses: actions/setup-python@v5
        if: env.GO == '1'
        with:
          python-version: '3.12'

      - name: Tools
        if: env.GO == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-color-emoji > /dev/null
          pip install -q kokoro-onnx==0.6.1 soundfile==0.14.0 edge-tts
          echo "CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      - name: Cache Kokoro model
        if: env.GO == '1'
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-v1.0

      - name: Download Kokoro model
        if: env.GO == '1'
        run: |
          mkdir -p .kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f .kokoro/kokoro-v1.0.onnx ] || curl -sSL -o .kokoro/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f .kokoro/voices-v1.0.bin ] || curl -sSL -o .kokoro/voices-v1.0.bin $base/voices-v1.0.bin

      # Same Kaggle path as the evening Short (Wan 2.2 TI2V-5B, private kernel sps-animate-status, T4 x2), only for the
      # scenes marked `animate` and only when no accepted clips are cached yet. Any failure: FLUX still + zoompan.
      - name: Animate (Kaggle GPU)
        if: env.GO == '1' && env.HAVE_CLIPS != '1'
        continue-on-error: true
        timeout-minutes: 150
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: status
          SPS_FLUX: ${{ vars.SPS_FLUX }}
          SPS_ENHANCE: ${{ vars.SPS_ENHANCE }}
        run: |
          fail() { echo "::warning::Animation skipped, using zoompan: $1"; echo "- Animation skipped: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ -n "$KAGGLE_API_TOKEN" ] || fail "no KAGGLE_API_TOKEN secret"
          pip install -q 'kaggle>=2.2' six || fail "kaggle CLI install failed"
          node animate/kaggle.mjs quota --min 3 > "$RUNNER_TEMP/quota.json" || fail "under 3 Kaggle GPU hours left this week ($(cat "$RUNNER_TEMP/quota.json"))"
          node story/render-story.mjs "$W/scenes.json" --prepare || fail "FLUX images / narration failed"
          plan="$W/build/$SLUG/plan.json"
          node animate/kaggle.mjs prepare "$W/scenes.json" --plan "$plan" --max 3 || fail "dataset upload failed"
          node animate/kaggle.mjs lock --minutes 60 || fail "another sps kernel is still running after 60 min"
          node animate/kaggle.mjs push --queue-minutes 20 --retry-minutes 30 || fail "kernel push failed (Kaggle busy?)"
          start=$(date +%s)
          node animate/kaggle.mjs wait --minutes 110 --queue-minutes 20 > "$RUNNER_TEMP/wait.json" || echo "::warning::Kaggle: $(cat "$RUNNER_TEMP/wait.json"); using any clips it finished"
          grep -q QUEUED_TOO_LONG "$RUNNER_TEMP/wait.json" && fail "the Kaggle GPU session was still queued after 20 min"
          node animate/kaggle.mjs fetch --to "$W/clips" --stills-to "$W/stills" > "$RUNNER_TEMP/fetch.json" || fail "could not download the clips"
          echo "- Kaggle: $(cat "$RUNNER_TEMP/fetch.json"), waited $(( ($(date +%s) - start) / 60 )) min, quota before: $(cat "$RUNNER_TEMP/quota.json")" >> "$GITHUB_STEP_SUMMARY"
          node animate/check-clips.mjs "$W/scenes.json" --clips "$W/clips" --plan "$plan" --stills "$W/stills" --summary "$GITHUB_STEP_SUMMARY"

      - name: Render
        id: render
        if: env.GO == '1'
        run: |
          node story/render-story.mjs "$W/scenes.json" | tee "$RUNNER_TEMP/render.txt"
          ffprobe -v error -show_entries format=duration:stream=width,height -of compact "$W/out/$SLUG.mp4" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the day's images and clips
        if: always() && env.GO == '1'
        uses: actions/cache/save@v4
        with:
          path: story/status/work
          key: status-${{ steps.d.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the video as an artifact (7 days)
        if: steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ env.SLUG }}
          path: |
            story/status/work/out/
            story/status/work/scenes.json
          retention-days: 7
          compression-level: 0

      # Download link: the mp4 on the media Worker (KV, 7 days). Then the festival card link (only once that page is live).
      - name: Host the download and add links
        id: host
        if: steps.render.outcome == 'success'
        run: |
          node scripts/publish.mjs --host-only --video "$W/out/$SLUG.mp4" --scenes "$W/scenes.json" | tee "$RUNNER_TEMP/host.json"
          url=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/host.json','utf8')).video_url||''")
          [ -n "$url" ] || { echo "::error::media upload failed"; exit 1; }
          node -e '
            const fs = require("fs"), [f, url] = process.argv.slice(1), s = JSON.parse(fs.readFileSync(f, "utf8"));
            const line = `Status video download karein (7 din tak, free): ${url}`;
            for (const k of ["youtube_description", "instagram_caption", "facebook_caption"])
              if (s[k] && !s[k].includes(url)) s[k] = s[k].replace(/\n\n/, `\n\n${line}\n\n`);
            fs.writeFileSync(f, JSON.stringify(s, null, 2) + "\n");' "$W/scenes.json" "$url"
          node scripts/festival-links.mjs "$W/scenes.json"
          echo "- Download link: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: YouTube (public at 06:00 IST on the festival day)
        id: yt
        if: steps.host.outcome == 'success' && !inputs.dry_run
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          at="${{ steps.d.outputs.day }}T$(node -p "require('./$W/scenes.json').publish_at || '06:00'")"
          node scripts/youtube.mjs upload --video "$W/out/$SLUG.mp4" --scenes "$W/scenes.json" --publish-at "$at" | tee "$RUNNER_TEMP/yt.json"
          grep -q '"status":"ok"' "$RUNNER_TEMP/yt.json"

      # Facebook Reel scheduled for the same time; Instagram queued ("ig: pending") for the `instagram` job.
      - name: Facebook and Instagram (Graph API)
        id: meta
        if: steps.yt.outcome == 'success'
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          [ -n "$META_PAGE_TOKEN" ] || { echo "::notice::META_* secrets not set; YouTube only"; exit 0; }
          at="${{ steps.d.outputs.day }}T$(node -p "require('./$W/scenes.json').publish_at || '06:00'")"
          node scripts/meta.mjs short --video "$W/out/$SLUG.mp4" --scenes "$W/scenes.json" \
            --video-url "$MEDIA_URL/m/$SLUG.mp4" --publish-at "$at" | tee "$RUNNER_TEMP/meta.json" || true

      - name: Dry run summary
        if: inputs.dry_run && steps.render.outcome == 'success'
        run: |
          at="${{ steps.d.outputs.day }}T$(node -p "require('./$W/scenes.json').publish_at || '06:00'")"
          node scripts/youtube.mjs upload --video "$W/out/$SLUG.mp4" --scenes "$W/scenes.json" --publish-at "$at" --dry-run > "$RUNNER_TEMP/yt-dry.json"
          node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(`- Dry run: would upload "${j.title}" with publishAt ${j.publishAt}\n\n\`\`\`\n${j.description}\n\`\`\``)' "$RUNNER_TEMP/yt-dry.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Record
        if: steps.yt.outcome == 'success'
        run: |
          mkdir -p story/published
          cp "$W/scenes.json" "story/published/$SLUG.json"
          yt=$(node -p "const y=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/yt.json','utf8')).youtube; y.url+' (public at '+y.publishAt+')'")
          fest=$(node -p "require('./$W/scenes.json').festival")
          echo "${{ steps.d.outputs.day }} | status | $SLUG | $fest | WhatsApp status Short (darshan, blessing, download link), public 06:00 IST" >> automation/log.md
          social=$(node -p "try{' | social: '+JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/meta.json','utf8')).summary}catch{''}")
          echo "- $SLUG | youtube: $yt | status video, made $(TZ=Asia/Kolkata date '+%d %b %H:%M') IST$social" >> automation/published.md
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/log.md automation/published.md "story/published/$SLUG.json"
          git commit -qm "Status $SLUG"
          git pull -q --rebase && git push -q

  # Instagram has no scheduled publishing: queued Reels ("ig: pending <time>" in automation/published.md, written for the
  # evening and festival status Shorts) are published here within 20 minutes of their time (see the header). Runs on every
  # trigger beside the other jobs, takes seconds when nothing is due, and never fails the workflow.
  instagram:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: shyam-instagram-queue
      cancel-in-progress: false
    env:
      MEDIA_URL: https://shyam-premi-media.sk9836413.workers.dev
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish queued Instagram Reels
        continue-on-error: true
        run: |
          [ -n "$META_PAGE_TOKEN" ] || { echo "::notice::META_* secrets not set"; exit 0; }
          node scripts/meta.mjs flush | tee "$RUNNER_TEMP/flush.json" || echo "::warning::An Instagram Reel failed; see the result (retried once on the next run)."
          git diff --quiet -- automation/published.md && exit 0
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/published.md
          git commit -qm "Instagram queue"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
