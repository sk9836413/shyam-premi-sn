# Shyam Premi SN: at most 3 YouTube Shorts a day (owner, 9 Nov 2026; scripts/day-plan.mjs decides which, and
# scripts/upload-guard.mjs enforces a hard cap of 3 Shorts per IST date): 5-6 a day (7-9 Nov) collapsed views to 0-15.
# PLUS one long katha video EVERY day (owner, 13 Nov 2026), outside the Shorts cap with its own cap of 1: long videos
# are the only source of watch hours (YPP 4,000 h before 31 Jan 2027), and inside the cap (Mon/Fri of normal days only)
# festivals pushed them out for 3 days (10-12 Nov).
# Re-planned 11 Nov 2026 around the festival "status" Short, the only format that went viral (Choti Diwali Status 798
# views, Dhanteras Status 456; katha Shorts avg 18): day-plan fills each day by priority, max 3:
#   movie part 07:00 > festival status Shorts (job `status`, scripts/status-engine.mjs: `eve` 20:00 the evening before,
#   `status` 00:30 on the day, `statusday` 08:30 on big festivals) > morning (weekday "day status" Short made by the
#   status engine, or a famous-temple darshan on festival days) > evening famous-temple darshan 19:00 > Kalyug ke
#   Bhagwan (Tue/Thu/Sat, KALYUG=on) > Dadi-Chhotu (Wed). Katha Shorts are cut. The long katha is not in this cap.
# A slot that is not planned for the day skips at once (no render). Photo posts and the Veo kit are not uploads.
# The long katha video (16:9, 5-10 min, scheduled for 12:30 IST, every day) is made by job `long` after every
# morning-slot run: the scheduler Worker dispatches slot=morning at 09:13 and 10:13 IST daily (and the schedule polls
# here), so it fires every day; the first run makes it, the rest skip (log.md). Subject from day-plan (the prompt).
# Morning window 05:30-11:59 IST, evening window 17:30-22:59 IST. GitHub's schedule often fires hours
# late, so it is polled every 30 minutes inside both windows; the first run in a window publishes and the
# rest skip (slot already in automation/log.md). Runs outside a window do nothing, so nothing posts at night.
# Every Short is animated where Kaggle allows (morning: up to 4 marked scenes; see the Animate step). The evening darshan Short is animated (image-to-video on Kaggle's free GPU, ~66 min), so the scheduler Worker
# dispatches slot=evening at 10:43 IST and YouTube publishes it at 19:00 IST (publishAt); 18:46 IST is the retry.
# An explicit slot works at any hour. If Kaggle fails, times out or has under 10 GPU hours left this week, the
# scenes fall back to FLUX stills + zoompan: the post is never skipped.
# Images (animate/frames.mjs, 6 Nov 2026): every image consumer (morning, evening, noon, status, long) first asks Workers AI
# FLUX (10,000 free neurons a day, ~326 per image, resets 05:30 IST); on 4006 / any failure the missing images are made
# with FLUX.1-schnell on the Kaggle GPU (one short sps-frames-<slot> session), and anything still missing gets a picture
# bank / real temple photo / plain stand-in in the renderer. Each run's summary has the image ledger (images per source,
# neurons). force_fallback=true skips Workers AI for a test run.
# slot=noon (dispatched by the scheduler on Wednesdays only at 10:13 IST, retry 18:46 IST; public 15:00 IST) is the "Dadi aur Chhotu" cartoon dialogue
# Short (STORY.md section 6, characters/): edge-tts voices, story images, lip-sync on Kaggle (~10-15 GPU-min), else the
# still two-shot with a speaker highlight. dry_run=true renders everything and keeps the video as an artifact only.
# Festival "WhatsApp status" Shorts (job `status`, scripts/status-engine.mjs + automation/festivals.json): after every
# evening-slot run (10:43 IST dispatch, the evening schedule, the 18:46 IST retry) the engine picks what is due: today's
# `eve` variant (public 20:00) and tomorrow's 00:30 `status` / 08:30 `statusday` variants of ONE festival. Its base spec
# (story/status/<date>.json or the theme) is animated once on Kaggle; every variant reuses those pictures/clips with its
# own hook, picture order and title, is rendered as a 15-25 s loop, hosted on the media Worker (download link), uploaded
# private with publishAt, scheduled on Facebook and queued for Instagram. slot=status (+ status_date = the festival day)
# runs only that job; with dry_run it renders and hosts every variant of that festival but never uploads or logs. The
# images and clips are cached per festival day, so a dry run's clips are reused by the real run.
# Real temple photos: before rendering, scripts/real-photos.mjs fetches licence-safe Wikimedia Commons photos for the
# spec's `temple` when footage/<temple>/ has none; the renderers show them on `real` scenes and credit them.
# Facebook + Instagram (scripts/meta.mjs, Graph API, never-expiring Page token in the META_PAGE_ID / META_PAGE_TOKEN / IG_USER_ID
# secrets; without them, or when Meta rejects the token, scripts/publish.mjs falls back to Make as before). Facebook Reels
# stop at 90 s, so a longer Short (Dadi aur Chhotu) is a normal Page video; Instagram Reels via the API take up to 15 min.
# Timing follows YouTube: the morning Short goes out at once, the Wednesday noon Short at 15:00 IST; the evening Short (19:00 IST) and the festival status
# Short (06:00 IST) are SCHEDULED on Facebook, and because Instagram has no scheduled publishing they are queued
# ("ig: pending <time>" in automation/published.md) and the `instagram` job, which runs on every trigger (no new cron),
# publishes them within 20 minutes of that time: the 18:46 IST evening dispatch waits for 19:00, the status Short goes
# out with the first run after 06:00 IST (the 05:47 IST schedule poll or the 09:13 IST morning dispatch), and a slot
# missed by over 6 hours is skipped. The long katha video is a normal Facebook Page video scheduled for 12:30 IST
# (in-stream ads later; resumable chunked upload, scripts/meta.mjs) when scripts/fb.mjs lets it; not on Instagram.
# FACEBOOK PLAN (owner, 11 Nov 2026, monetization challenge; scripts/fb.mjs): Facebook gets at most 2 videos + 1 photo a
# day (+ the daily long katha as a 12:30 feed video since 13 Nov, not one of the 2). Every Facebook step asks `node scripts/fb.mjs flags` for its own Facebook time (--fb-at: Reel 1 = the status
# Short at its status time or the day-status Short ~07:30/as soon as ready, Reel 2 = the evening darshan 20:30, 18:00 on
# a 20:00 eve-status day; Feed = the long katha 12:30) or --no-fb; YouTube and Instagram times are unchanged. Kalyug: no Facebook.
name: Daily story video

on:
  schedule:
    - cron: '17,47 0-6 * * *'    # 05:47-12:17 IST
    - cron: '17,47 12-17 * * *'  # 17:47-23:17 IST
  workflow_dispatch:
    inputs:
      slot:
        description: morning, evening, noon, long, status, movie, kalyug or bhajan (empty = by time of day; long = only the long video, any day; noon = the Dadi aur Chhotu Short, Wednesdays of normal days unless dry_run; status = only tomorrow's festival status Short; movie = only the next due mini-movie part; kalyug = only tomorrow's Kalyug ke Bhagwan episode)
        required: false
        default: ''
      dry_run:
        description: Render only (no YouTube, no Instagram/Facebook, nothing logged); the video becomes the run's artifact
        type: boolean
        default: false
      status_date:
        description: status slot only - festival day YYYY-MM-DD (empty = tomorrow in IST)
        required: false
        default: ''
      movie_part:
        description: movie slot only - a part file, e.g. story/movies/khatu-shyam-amar-katha/part-1.json (empty = the next due part)
        required: false
        default: ''
      kalyug_spec:
        description: kalyug slot only - an episode file, e.g. story/kalyug/pilot-ep1.json (empty = tomorrow's episode)
        required: false
        default: ''
      kaggle_reuse:
        description: movie / kalyug slot only - render from the last finished sps-movie / sps-kalyug Kaggle session (no new GPU session)
        type: boolean
        default: false
      force_fallback:
        description: Skip Workers AI FLUX for this run (test the Kaggle FLUX / picture-bank fallback, animate/frames.mjs)
        type: boolean
        default: false

permissions:
  contents: write

# Music engine (music/engine.mjs): repo variable MUSIC_ENGINE=on puts a licence-checked library track under every
# render-story.mjs Short instead of the synthesized drone; unset = old sound.
env:
  MUSIC_ENGINE: ${{ vars.MUSIC_ENGINE }}
  # AI-sung bhajans (music/bhajan.mjs, owner 13 Nov 2026): repo variable BHAJAN_VOCALS=on puts a QA-passed library bhajan
  # (deity / festival match, no repeat within 5 days) into the Shorts and the long video; the voice never overlaps it.
  BHAJAN_VOCALS: ${{ vars.BHAJAN_VOCALS }}
  # Owner's one-day cap exception for scripts/upload-guard.mjs (YYYY-MM-DD; any other day = normal cap of 3).
  EXTRA_UPLOAD_DAY: ${{ vars.EXTRA_UPLOAD_DAY }}

# Evening runs have their own queue, so the long animated evening job can run beside the morning one; within a
# slot, runs queue and the later one skips once the slot is in log.md. log.md and published.md merge as unions.
# Uploads are idempotent (7 Nov 2026: the 18:43 IST evening schedule run and the 18:46 IST dispatch ran side by side and
# BOTH status jobs uploaded the Diwali status Short to YouTube and Facebook): the status and long jobs also queue per
# day (job concurrency below), and right before every upload scripts/upload-guard.mjs claims "<day> <slot>" in
# automation/published.md with an atomic push (a second run finds the claim or the log.md line and skips). Then
# youtube.mjs and meta.mjs look for the same title/caption among the last 36 h of uploads and posts and never repeat it.
concurrency:
  group: ${{ inputs.slot == 'bhajan' && 'daily-story-bhajan' || inputs.slot == 'noon' && 'daily-story-noon' || inputs.slot == 'status' && 'daily-story-status' || inputs.slot == 'movie' && 'daily-story-movie' || inputs.slot == 'kalyug' && 'daily-story-kalyug' || ((inputs.slot == 'evening' || github.event.schedule == '17,47 12-17 * * *') && 'daily-story-evening' || 'daily-story') }}
  cancel-in-progress: false

jobs:
  # The slot this run would make and its IST date, only for the story job's queue below: on 7 Nov 2026 an evening
  # schedule run and the 18:46 IST evening dispatch were NOT serialised by the workflow-level group above, so the queue
  # key is now computed from the clock like the Date step does (same windows), not from github.event.schedule.
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      key: ${{ steps.k.outputs.key }}
    steps:
      - id: k
        run: |
          slot="${{ inputs.slot }}"
          if [ -z "$slot" ]; then
            hm=$((10#$(TZ=Asia/Kolkata date +%H%M)))
            if [ $hm -ge 530 ] && [ $hm -lt 1200 ]; then slot=morning; elif [ $hm -ge 1730 ] && [ $hm -lt 2300 ]; then slot=evening; else slot=none; fi
          fi
          echo "key=$slot-$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

  story:
    needs: slot
    runs-on: ubuntu-latest
    # One story job per slot and day at a time (cancel-in-progress false): a second run of the same slot waits, then
    # its Date step finds the slot in log.md and skips. slot=status/long/movie runs only route to their own jobs.
    concurrency:
      group: shyam-story-${{ needs.slot.outputs.key }}
      cancel-in-progress: false
    outputs:
      # The long video job runs after every morning-slot run (and for slot=long); it skips once done.
      long: ${{ steps.date.outputs.long }}
      # The festival status job runs after every evening-slot run (and for slot=status); it skips once scheduled.
      status: ${{ steps.date.outputs.status }}
      # The mini-movie job runs after every evening-slot run (and for slot=movie): it makes the next due part.
      movie: ${{ steps.date.outputs.movie }}
      # The Kalyug ke Bhagwan job runs after every evening-slot run (and for slot=kalyug): it makes tomorrow's episode.
      kalyug: ${{ steps.date.outputs.kalyug }}
      # Bhajan Shorts (scripts/bhajan-short.mjs, automation/chhath-2026.json): the slot (bhajan / morning / evening) whose
      # Short is a library bhajan with bank pictures, made by the `bhajan` job instead of this one.
      bhajan: ${{ steps.date.outputs.bhajan }}
      bhajan_slot: ${{ steps.date.outputs.bhajan_slot }}
      # IST date and the festival day of a status run: the long and status jobs queue per day on them.
      today: ${{ steps.date.outputs.today }}
      status_day: ${{ steps.date.outputs.status_day }}
    # 230 + up to 40 min for the Kaggle FLUX images when Workers AI is out of neurons
    timeout-minutes: 270
    env:
      FFMPEG_PATH: ffmpeg
      PYTHON: python
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
      SUB_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      # The media Worker runs FLUX and hosts the videos, so no Cloudflare API token is needed.
      MEDIA_URL: https://shyam-premi-media.sk9836413.workers.dev
      SPS_WORKERS_AI: ${{ inputs.force_fallback && '0' || '' }}
      # day-plan counts the Kalyug ke Bhagwan episode only when the repo variable is on (the same plan as the kalyug job)
      KALYUG: ${{ vars.KALYUG }}
    steps:
      - uses: actions/checkout@v4

      - name: Date and slot
        id: date
        run: |
          # A queued run may have been triggered before the previous one recorded its slot: use the latest log.
          git fetch -q origin main && git checkout -q origin/main -- automation/log.md
          today=$(TZ=Asia/Kolkata date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          sd="${{ inputs.status_date }}"; echo "status_day=${sd:-$(TZ=Asia/Kolkata date -d tomorrow +%F)}" >> "$GITHUB_OUTPUT"
          slot="${{ inputs.slot }}"
          if [ "$slot" = long ]; then
            echo "long=true" >> "$GITHUB_OUTPUT"; echo "done=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Long video only"; exit 0
          fi
          if [ "$slot" = status ]; then
            echo "status=true" >> "$GITHUB_OUTPUT"; echo "done=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Festival status video only"; exit 0
          fi
          if [ "$slot" = movie ]; then
            echo "movie=true" >> "$GITHUB_OUTPUT"; echo "done=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Mini-movie part only"; exit 0
          fi
          if [ "$slot" = kalyug ]; then
            echo "kalyug=true" >> "$GITHUB_OUTPUT"; echo "done=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Kalyug ke Bhagwan episode only"; exit 0
          fi
          if [ "$slot" = bhajan ]; then
            echo "bhajan=true" >> "$GITHUB_OUTPUT"; echo "bhajan_slot=bhajan" >> "$GITHUB_OUTPUT"; echo "done=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Bhajan Short only (automation/chhath-2026.json)"; exit 0
          fi
          if [ -z "$slot" ]; then
            hm=$((10#$(TZ=Asia/Kolkata date +%H%M)))
            if [ $hm -ge 530 ] && [ $hm -lt 1200 ]; then slot=morning
            elif [ $hm -ge 1730 ] && [ $hm -lt 2300 ]; then slot=evening
            else
              echo "::notice::Outside the posting windows ($hm IST)"
              echo "done=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          if [ "$slot" = morning ]; then echo "long=true" >> "$GITHUB_OUTPUT"; fi
          # Festival status Shorts (status engine): every evening-slot run checks what is due (today's 20:00 `eve` variant,
          # tomorrow's 00:30 / 08:30 variants); the job runs after this one, so it never competes with the evening Short
          # of the same run for the Kaggle GPU, and the 10:43 IST dispatch makes the 20:00 variant in good time.
          if [ "$slot" = evening ]; then echo "status=true" >> "$GITHUB_OUTPUT"; fi
          # Mini-movies (STORY.md section 7) are made a day or more ahead by the `movie` job, which runs after evening runs.
          if [ "$slot" = evening ]; then echo "movie=true" >> "$GITHUB_OUTPUT"; echo "kalyug=true" >> "$GITHUB_OUTPUT"; fi
          if grep -q "^$today | $slot |" automation/log.md; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$today $slot already published"
          elif [ "$slot" = morning ] && grep -q "^$today | movie |" automation/log.md; then
            # A movie part is scheduled for 07:00 today: it IS the morning Short. Only the trend research and the Veo kit
            # run, then "Movie morning" records the slot.
            echo "movie_day=$(grep -m1 "^$today | movie |" automation/log.md | cut -d'|' -f3 | xargs)" >> "$GITHUB_OUTPUT"
            echo "movie_kind=movie" >> "$GITHUB_OUTPUT"
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$today morning = the scheduled movie part"
          elif ! node scripts/day-plan.mjs --date "$today" --slot "$slot" --check > "$RUNNER_TEMP/plan.json"; then
            # At most 3 uploads a day (scripts/day-plan.mjs): e.g. noon only on Wednesdays when nothing better fits. A
            # Kalyug ke Bhagwan episode (08:00) no longer replaces the morning Short: both run when the cap allows.
            # day-plan also writes what/kind/theme: kind=daystatus = the status engine makes the morning Short.
            if [ "${{ inputs.dry_run }}" = true ]; then
              echo "::notice::Dry run of a slot not planned today: $(cat "$RUNNER_TEMP/plan.json")"
            else
              echo "done=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$today $slot is not planned today: $(node -p "require(process.env.RUNNER_TEMP + '/plan.json').why")"
            fi
          elif [ "$(node -p "require(process.env.RUNNER_TEMP + '/plan.json').kind")" = bhajan ]; then
            # Chhath 2026 override: this slot is a bhajan Short (job `bhajan`, no Claude, no Kaggle). Without a QA-passed
            # Chhath bhajan it falls back to a Chhath Surya temple / ghat darshan Short made here (day-plan `fallback`).
            if node scripts/bhajan-short.mjs pick --date "$today" --slot "$slot"; then
              echo "bhajan=true" >> "$GITHUB_OUTPUT"; echo "bhajan_slot=$slot" >> "$GITHUB_OUTPUT"; echo "done=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$today $slot = Chhath bhajan Short (job bhajan)"
            else
              echo "kind=temple" >> "$GITHUB_OUTPUT"
              echo "what=$(node -p "require(process.env.RUNNER_TEMP + '/plan.json').fallback")" >> "$GITHUB_OUTPUT"
              echo "::warning::$today $slot: no Chhath bhajan in the library, Chhath Surya temple / ghat darshan instead"
            fi
          fi

      - uses: actions/setup-node@v4
        if: steps.date.outputs.done != 'true' || steps.date.outputs.movie_day != ''
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: steps.date.outputs.done != 'true'
        with:
          python-version: '3.12'

      - name: Tools
        if: steps.date.outputs.done != 'true'
        run: |
          # fonts-noto-color-emoji: the day status Short's Hindi overlays (story/status-overlays.mjs) carry emoji
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-color-emoji > /dev/null
          pip install -q kokoro-onnx==0.6.1 soundfile==0.14.0 edge-tts

      - name: Cache Kokoro model
        if: steps.date.outputs.done != 'true'
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-v1.0

      - name: Download Kokoro model
        if: steps.date.outputs.done != 'true'
        run: |
          mkdir -p .kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f .kokoro/kokoro-v1.0.onnx ] || curl -sSL -o .kokoro/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f .kokoro/voices-v1.0.bin ] || curl -sSL -o .kokoro/voices-v1.0.bin $base/voices-v1.0.bin

      # Daily trend research (scripts/trend-signals.mjs): YouTube autocomplete (Roman + Devanagari seeds), Google Trends
      # India and the channel's own numbers -> automation/trends/<date>.md with ranked topics for the next 3 days, read by
      # every slot's story prompt (STORY.md section 1). Once a day, on the morning run only; a file already committed
      # today is reused. Committed by the Record step. Free endpoints; any failure leaves the story as before.
      - name: Trend research
        if: (steps.date.outputs.done != 'true' || steps.date.outputs.movie_day != '') && steps.date.outputs.slot == 'morning'
        continue-on-error: true
        timeout-minutes: 10
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SHYAM_YT_CLIENT_ID: ${{ secrets.SHYAM_YT_CLIENT_ID }}
          SHYAM_YT_CLIENT_SECRET: ${{ secrets.SHYAM_YT_CLIENT_SECRET }}
          SHYAM_YT_REFRESH_TOKEN: ${{ secrets.SHYAM_YT_REFRESH_TOKEN }}
        run: |
          git checkout -q origin/main -- automation/trends 2>/dev/null || true
          node scripts/trend-signals.mjs --date "${{ steps.date.outputs.today }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write the story
        if: steps.date.outputs.done != 'true' && steps.date.outputs.kind != 'daystatus'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/validate.mjs:*),Bash(ls:*)"
          prompt: |
            Write today's Shyam Premi SN story video. Today's date (IST) is ${{ steps.date.outputs.today }}, slot: ${{ steps.date.outputs.slot }}.
            Follow automation/STORY.md exactly${{ steps.date.outputs.slot == 'noon' && ' (the noon slot is the "Dadi aur Chhotu" dialogue Short: section 6)' || '' }}.
            Today's plan for this slot (scripts/day-plan.mjs): ${{ steps.date.outputs.what || 'see the table at the top of STORY.md' }}.
            Today's trend research is automation/trends/${{ steps.date.outputs.today }}.md (if it is missing, the newest file in
            automation/trends/): read its first 100 lines and use it as STORY.md section 1 says.
            Write every tts in the warm spoken style of STORY.md "Spoken style" (short sentences, max 18 words).
            Write story/today/scenes.json, make scripts/validate.mjs pass,
            and append one line to automation/log.md. Change nothing else.

      # The morning "day status" Short (Somvar Mahadev, Mangalvar Salasar Balaji, ...; Ekadashi: Gyaras Khatu Shyam) is
      # made by the status engine (scripts/status-themes.mjs), not by Claude: 15-25 s loop, bold Hindi hook, "स्टेटस पर
      # लगाएं", title "<Day> <Deity> Status | <Hindi> स्टेटस वीडियो #Shorts"; names and the first picture rotate weekly.
      - name: Day status (status engine)
        if: steps.date.outputs.done != 'true' && steps.date.outputs.kind == 'daystatus'
        run: node scripts/status-engine.mjs day --date "${{ steps.date.outputs.today }}" --out story/today/scenes.json --log automation/log.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate
        if: steps.date.outputs.done != 'true'
        run: |
          node scripts/validate.mjs --soft-topics story/today/scenes.json
          slug=$(node -p "require('./story/today/scenes.json').slug")
          case "$slug" in "${{ steps.date.outputs.today }}-${{ steps.date.outputs.slot }}-"*) ;; *) echo "::error::Unexpected slug $slug"; exit 1;; esac
          grep -q "^${{ steps.date.outputs.today }} | ${{ steps.date.outputs.slot }} |" automation/log.md || { echo "::error::log.md line missing"; exit 1; }
          echo "SLUG=$slug" >> "$GITHUB_ENV"

      # Daily Veo kit (scripts/veo-kit.mjs): YouTube's own AI video tool (Veo in the YouTube app) has no API, so a person
      # makes 1-2 hero Shorts by hand. 2 ideas (festival, then today's trends file, then Khatu Shyam ji; never one of today's
      # slots, so it runs after the morning story is in log.md, even if that failed), 3 FLUX / licence-safe real photos
      # each (6 images), Veo prompts, titles and captions -> /kit/<date>.html on the media Worker, an email (RESEND_API_KEY),
      # a CRM task (INGEST_TOKEN) and this run's summary. Once a day (skips if the kit exists); never blocks the post.
      - name: Veo kit
        if: ${{ !cancelled() && (steps.date.outputs.done != 'true' || steps.date.outputs.movie_day != '') && steps.date.outputs.slot == 'morning' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node scripts/veo-kit.mjs --date "${{ steps.date.outputs.today }}"

      # On a movie day the scheduled part (YouTube publishAt 07:00, Facebook scheduled, Instagram queued) is the morning
      # Short: record the slot so later morning triggers skip, and commit today's trend research for the other slots.
      # The same on a kalyug day for the scheduled Kalyug ke Bhagwan episode (08:00).
      - name: Movie morning
        if: ${{ !cancelled() && steps.date.outputs.movie_day != '' && !inputs.dry_run }}
        run: |
          today="${{ steps.date.outputs.today }}"; slug="${{ steps.date.outputs.movie_day }}"; kind="${{ steps.date.outputs.movie_kind }}"
          line=$(grep -m1 "^$today | $kind | $slug |" automation/log.md)
          what="mini-movie part (scheduled 07:00, replaces the katha Short)"
          [ "$kind" = kalyug ] && what="Kalyug ke Bhagwan episode (scheduled 08:00, replaces the morning Short)"
          echo "$today | morning | $slug | $(echo "$line" | cut -d'|' -f4 | xargs) | $what" >> automation/log.md
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/log.md
          [ -d automation/trends ] && git add automation/trends
          git commit -qm "Morning $today: $kind $slug"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done

      # Real temple photos (Wikimedia Commons, CC0 / PD / CC BY only, exact temple only) for the spec's `temple`, fetched
      # once when footage/<temple>/ has none (searched at most every 30 days); committed with the Record step.
      - name: Real temple photos
        if: steps.date.outputs.done != 'true'
        continue-on-error: true
        run: node scripts/real-photos.mjs --spec story/today/scenes.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Every Short is animated: evening/noon up to 4 scenes, morning the (up to 4) scenes marked `animate`, become
      # real clips of their scene's length (Wan 2.2 TI2V-5B on the private Kaggle kernel sps-animate-<slot>, T4 x2), then
      # an automatic check rejects face drift, flicker and colour streaks. One session at a time (lock); a session still
      # queued after 20 min, a failure or a timeout leaves the zoompan stills. Quota guard: morning needs 5 GPU hours
      # left this week, evening/noon 3.
      # Quality (animate/REPORT.md section 10): the kernel also makes the evening's hero darshan clip with Wan 2.2
      # I2V-A14B (only while >= 6 GPU hours are left), RIFE-interpolates every clip to 30 fps and upscales clips (1080 px)
      # and stills (2160 px) with Real-ESRGAN. Every part falls back to the old path; repo variables SPS_ENHANCE=0 /
      # SPS_HERO14B=0 switch one off, SPS_FLUX=1 also re-makes the start frames with FLUX.1-schnell on the GPU (+7.7 min).
      # Images first (animate/frames.mjs): Workers AI FLUX, else FLUX.1-schnell on the Kaggle GPU (sps-frames-<slot>,
      # ~6 min + ~1 min per image), so the Animate and Render steps find every image cached. Never fails the run.
      - name: Images (Workers AI, else Kaggle FLUX)
        if: steps.date.outputs.done != 'true' && contains(fromJSON('["morning","evening","noon"]'), steps.date.outputs.slot)
        continue-on-error: true
        timeout-minutes: 50
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          SPS_SLOT: ${{ steps.date.outputs.slot }}
        run: |
          [ -n "$KAGGLE_API_TOKEN" ] && pip install -q 'kaggle>=2.2' six
          if [ "${{ steps.date.outputs.slot }}" = noon ]; then
            node animate/frames.mjs story/today/scenes.json --visuals story/today/char/images --wait 35
          else
            node animate/frames.mjs story/today/scenes.json --wait 40
          fi

      - name: Animate (Kaggle GPU)
        id: anim
        if: steps.date.outputs.done != 'true' && contains(fromJSON('["morning","evening"]'), steps.date.outputs.slot)
        continue-on-error: true
        timeout-minutes: 170
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: ${{ steps.date.outputs.slot }}
          MIN_HOURS: ${{ steps.date.outputs.slot == 'morning' && '5' || '3' }}
          LOCK_MINUTES: ${{ steps.date.outputs.slot == 'evening' && '45' || '15' }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          SPS_FLUX: ${{ vars.SPS_FLUX }}
          SPS_ENHANCE: ${{ vars.SPS_ENHANCE }}
          SPS_HERO14B: ${{ vars.SPS_HERO14B }}
        run: |
          fail() { echo "::warning::Animation skipped, using zoompan: $1"; echo "- Animation skipped: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ -n "$KAGGLE_API_TOKEN" ] || fail "no KAGGLE_API_TOKEN secret"
          pip install -q 'kaggle>=2.2' six || fail "kaggle CLI install failed"
          node animate/kaggle.mjs quota --min "$MIN_HOURS" > "$RUNNER_TEMP/quota.json" || fail "under $MIN_HOURS Kaggle GPU hours left this week ($(cat "$RUNNER_TEMP/quota.json"))"
          left=$(node -p "Math.floor(require(process.env.RUNNER_TEMP + '/quota.json').left || 0)")
          [ "$left" -ge 6 ] || export SPS_HERO14B=0
          node story/render-story.mjs story/today/scenes.json --prepare || fail "FLUX images / narration failed"
          plan="story/today/build/$SLUG/plan.json"
          node animate/kaggle.mjs prepare story/today/scenes.json --plan "$plan" --max 4 ${{ vars.SHYAM_TTS == 'chatterbox' && '--voice' || '' }} || fail "dataset upload failed"
          node animate/kaggle.mjs lock --minutes "$LOCK_MINUTES" || fail "another sps-animate kernel is still running after $LOCK_MINUTES min"
          node animate/kaggle.mjs push --queue-minutes 20 --retry-minutes "$LOCK_MINUTES" || fail "kernel push failed (Kaggle busy?)"
          start=$(date +%s)
          node animate/kaggle.mjs wait --minutes 115 --queue-minutes 20 > "$RUNNER_TEMP/wait.json" || echo "::warning::Kaggle: $(cat "$RUNNER_TEMP/wait.json"); using any clips it finished"
          grep -q QUEUED_TOO_LONG "$RUNNER_TEMP/wait.json" && fail "the Kaggle GPU session was still queued after 20 min"
          node animate/kaggle.mjs fetch --to story/today/clips --voice-to story/today/voice --stills-to story/today/stills > "$RUNNER_TEMP/fetch.json" || fail "could not download the clips"
          echo "- Kaggle: $(cat "$RUNNER_TEMP/fetch.json"), waited $(( ($(date +%s) - start) / 60 )) min, quota before: $(cat "$RUNNER_TEMP/quota.json")" >> "$GITHUB_STEP_SUMMARY"
          node animate/check-clips.mjs story/today/scenes.json --clips story/today/clips --plan "$plan" --stills story/today/stills --summary "$GITHUB_STEP_SUMMARY"

      # Noon: the "Dadi aur Chhotu" dialogue Short (STORY.md section 6; characters/dialogue.py, characters/README.md).
      # Voices (edge-tts, pauses between turns) and 3-6 FLUX story images are made here.
      - name: Characters (voices, story images, shot plan)
        if: steps.date.outputs.done != 'true' && steps.date.outputs.slot == 'noon'
        env:
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
        run: |
          pip install -q pillow
          c="python -I characters/dialogue.py"; d=story/today/char
          $c voice --spec story/today/scenes.json --channel shyam --out $d/voice | tee -a "$GITHUB_STEP_SUMMARY"
          $c images --spec story/today/scenes.json --out $d/images
          $c plan --spec story/today/scenes.json --channel shyam --voice $d/voice --out $d/plan.json

      # Lip-sync on Kaggle (private kernel sps-char-shyam, MuseTalk 1.5 on the canonical clip library, T4 x2, ~10-15 min),
      # after the morning job's session (same lock: one sps kernel at a time). No secret, under 2 GPU hours left, a busy
      # account or any failure: the renderer uses the still two-shot with a speaker highlight for the missing lines.
      - name: Lip-sync (Kaggle GPU)
        if: steps.date.outputs.done != 'true' && steps.date.outputs.slot == 'noon'
        continue-on-error: true
        timeout-minutes: 110
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: char-shyam
        run: |
          fail() { echo "::warning::Lip-sync skipped, using stills: $1"; echo "- Lip-sync skipped: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          # A per-episode look (spec "look": new setting and outfits, images look-*.jpg) replaces the canonical clip library
          # (identical frames every day got 0 views), so there is nothing to lip-sync: the renderer animates the stills.
          if [ -f story/today/char/images/look-both.jpg ]; then echo "- Lip-sync: not used (per-episode look)" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          [ -n "$KAGGLE_API_TOKEN" ] || fail "no KAGGLE_API_TOKEN secret"
          pip install -q 'kaggle>=2.2' six || fail "kaggle CLI install failed"
          node animate/kaggle.mjs quota --min 2 > "$RUNNER_TEMP/quota.json" || fail "under 2 Kaggle GPU hours left this week ($(cat "$RUNNER_TEMP/quota.json"))"
          python -I characters/dialogue.py dataset --plan story/today/char/plan.json --voice story/today/char/voice --out animate/dataset --max-minutes 30 || fail "dataset build failed"
          node animate/kaggle.mjs upload || fail "dataset upload failed"
          node animate/kaggle.mjs lock --minutes 40 || fail "another sps kernel was still running after 40 min"
          node animate/kaggle.mjs push --queue-minutes 20 --retry-minutes 20 || fail "kernel push failed (Kaggle busy?)"
          start=$(date +%s)
          node animate/kaggle.mjs wait --minutes 45 --queue-minutes 20 > "$RUNNER_TEMP/wait.json" || echo "::warning::Kaggle: $(cat "$RUNNER_TEMP/wait.json"); using any lines it finished"
          grep -q QUEUED_TOO_LONG "$RUNNER_TEMP/wait.json" && fail "the Kaggle GPU session was still queued after 20 min"
          node animate/kaggle.mjs fetch --to story/today/char/lipsync > "$RUNNER_TEMP/fetch.json" || fail "could not download the lip-sync clips"
          echo "- Lip-sync: $(node characters/summary.mjs "$RUNNER_TEMP/fetch.json") (waited $(( ($(date +%s) - start) / 60 )) min; quota before: $(cat "$RUNNER_TEMP/quota.json"))" >> "$GITHUB_STEP_SUMMARY"

      # Narration: edge-tts hi-IN-MadhurNeural. Only when the repo variable SHYAM_TTS is "chatterbox" does the Kaggle
      # session also narrate with Chatterbox (story/today/voice), used when every line succeeded. Off since the 4 Nov
      # A/B: Chatterbox said "Shaam" for Shyam and "Ganej" for Ganesh (animate/REPORT.md section 9).
      - name: Render
        if: steps.date.outputs.done != 'true'
        env:
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          VOICE_DIR: story/today/voice
        run: |
          if [ "${{ steps.date.outputs.slot }}" = noon ]; then
            d=story/today/char; mkdir -p story/today/out
            # Cover frame: 2-4 big Devanagari words over the first 0.4 s (story/cover.mjs); skipped if Chrome fails.
            node story/cover.mjs story/today/scenes.json $d/cover.png --dialogue || echo "::warning::cover frame skipped"
            python -I characters/dialogue.py render --spec story/today/scenes.json --channel shyam --plan $d/plan.json --voice $d/voice \
              --lipsync $d/lipsync --images $d/images --out "story/today/out/$SLUG.mp4" --meta $d/meta.json --credits --cover $d/cover.png | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node story/render-story.mjs story/today/scenes.json
          fi

      - name: Keep the dry-run video (7 days)
        if: inputs.dry_run && steps.date.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ steps.date.outputs.slot }}
          path: |
            story/today/out/
            story/today/scenes.json
            story/today/char/meta.json
            story/today/char/plan.json
          retention-days: 7
          compression-level: 0

      - name: Festival links
        if: steps.date.outputs.done != 'true'
        continue-on-error: true
        run: node scripts/festival-links.mjs story/today/scenes.json

      # Re-check right before the upload and claim the slot (scripts/upload-guard.mjs): another run that published or
      # claimed "<today> <slot>" meanwhile wins, and this one uploads, posts and records nothing.
      - name: Claim the upload
        id: claim
        if: steps.date.outputs.done != 'true' && !inputs.dry_run
        run: node scripts/upload-guard.mjs claim --day "${{ steps.date.outputs.today }}" --slot "${{ steps.date.outputs.slot }}" --slug "$SLUG"

      - name: YouTube
        id: yt
        continue-on-error: true
        if: steps.date.outputs.done != 'true' && !inputs.dry_run && steps.claim.outputs.go == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        # The evening Short is made hours early, so YouTube publishes it at 19:00 IST (straight away if later); the Wednesday
        # noon Short at 15:00 IST, so the day's 3 uploads are spread out (morning ~10:30, 15:00, 19:00).
        run: node scripts/youtube.mjs upload --video "story/today/out/$SLUG.mp4" --scenes story/today/scenes.json ${{ steps.date.outputs.slot == 'evening' && '--publish-at 19:00' || steps.date.outputs.slot == 'noon' && '--publish-at 15:00' || '' }} | tee "$RUNNER_TEMP/yt.json"

      - name: Instagram and Facebook (Graph API, Make fallback)
        id: make
        continue-on-error: true
        if: steps.date.outputs.done != 'true' && !inputs.dry_run && steps.claim.outputs.go == 'true'
        env:
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        # Evening: Facebook scheduled for 19:00 IST like YouTube, Instagram queued for the `instagram` job. When YouTube
        # already had this video (an earlier run uploaded it), that run posted to Facebook/Instagram too: skip.
        run: |
          if grep -q '"duplicate":true' "$RUNNER_TEMP/yt.json" 2>/dev/null; then
            echo '{"status":"ok","summary":"skipped (the YouTube video already existed: posted by an earlier run)"}' | tee "$RUNNER_TEMP/make.json"; exit 0
          fi
          # Facebook's own time or no Facebook (scripts/fb.mjs: at most 2 videos a day); YouTube/Instagram keep --publish-at.
          fb=$(node scripts/fb.mjs flags --date "${{ steps.date.outputs.today }}" --slot "${{ steps.date.outputs.slot }}" || echo --no-fb)
          node scripts/publish.mjs --video "story/today/out/$SLUG.mp4" --scenes story/today/scenes.json ${{ steps.date.outputs.slot == 'evening' && '--publish-at 19:00' || steps.date.outputs.slot == 'noon' && '--publish-at 15:00' || '' }} $fb | tee "$RUNNER_TEMP/make.json"

      - name: Record
        # Only once something was published, so a failed render is retried by the next slot run.
        if: always() && env.SLUG != '' && (steps.yt.outcome == 'success' || steps.make.outcome == 'success')
        run: |
          mkdir -p story/published
          cp story/today/scenes.json "story/published/$SLUG.json"
          yt=$(node -p "try{const y=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/yt.json','utf8')).youtube;y.url+(y.publishAt?' (public at '+y.publishAt+')':'')}catch{''}")
          anim=$(node characters/summary.mjs --record)
          echo "- $SLUG | youtube: ${yt:-failed} | social: $(node -p "try{const j=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/make.json','utf8'));j.summary||j.status}catch{'failed'}")$anim" >> automation/published.md
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/log.md automation/calendar.md automation/published.md "story/published/$SLUG.json" footage
          [ -d automation/trends ] && git add automation/trends
          git commit -qm "Story $SLUG"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i * 10)); done

      - name: Release the claim after a failed upload
        if: always() && steps.claim.outputs.go == 'true' && steps.yt.outcome != 'success' && steps.make.outcome != 'success'
        run: node scripts/upload-guard.mjs release --day "${{ steps.date.outputs.today }}" --slot "${{ steps.date.outputs.slot }}" --slug "$SLUG" --reason "YouTube ${{ steps.yt.outcome }}, social ${{ steps.make.outcome }}"

      - name: Fail if a platform failed
        if: steps.yt.outcome == 'failure' || steps.make.outcome == 'failure'
        run: |
          echo "::error::YouTube: ${{ steps.yt.outcome }}, Make: ${{ steps.make.outcome }}"
          exit 1

  # Long katha video (automation/STORY.md section 5) EVERY day (owner, 13 Nov 2026; scripts/day-plan.mjs, outside the
  # 3-Shorts cap, upload guard cap 1 long a day): 16:9, 5-10 min, private with publishAt 12:30 IST (straight away when
  # that has passed). Subject: day-plan's `what` (festival katha/vidhi on a festival day unless a long video told it in
  # the last 30 days, else the section 5 order / Mandir Itihas series). Runs after the morning Short (whatever its result) or alone with slot=long, so the
  # Shorts never wait for it or fail because of it. Story and images are cached per day, so a retry costs no
  # extra neurons; after 3 failed attempts it waits for the next day. If the upload fails (quotaExceeded or
  # an error) the mp4 is parked on the media Worker and the next run retries it (scripts/long-pending.mjs).
  long:
    needs: story
    if: always() && needs.story.outputs.long == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 210
    # One long video per day even when two morning runs overlap (the later one queues, then skips via log.md).
    concurrency:
      group: shyam-long-${{ needs.story.outputs.today }}
      cancel-in-progress: false
    env:
      FFMPEG_PATH: ffmpeg
      PYTHON: python
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
      SUB_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      MEDIA_URL: https://shyam-premi-media.sk9836413.workers.dev
      MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
      SPS_WORKERS_AI: ${{ inputs.force_fallback && '0' || '' }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      # Dormant: a separate Google project's OAuth client, used only if all three secrets are ever set.
      SHYAM_YT_CLIENT_ID: ${{ secrets.SHYAM_YT_CLIENT_ID }}
      SHYAM_YT_CLIENT_SECRET: ${{ secrets.SHYAM_YT_CLIENT_SECRET }}
      SHYAM_YT_REFRESH_TOKEN: ${{ secrets.SHYAM_YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Git identity
        run: |
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Retry a pending upload
        continue-on-error: true
        run: |
          [ -s automation/long-pending.md ] || { echo "Nothing pending"; exit 0; }
          node scripts/long-pending.mjs retry | tee "$RUNNER_TEMP/retry.json"
          if ! git diff --quiet automation; then
            git add automation && git commit -qm "Long video upload retry" && git pull -q --rebase && git push -q
          fi

      - name: Date
        id: date
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          # Every day (day-plan); it also writes `what` = today's subject for the story prompt. An explicit slot=long
          # dispatch always runs; the upload guard allows 1 long video a day.
          node scripts/day-plan.mjs --date "$today" --slot long > "$RUNNER_TEMP/plan.json" || true
          if grep -q "^$today | long |" automation/log.md; then
            echo "::notice::$today long video already made"
          elif [ "${{ inputs.slot }}" != long ] && [ "$(node -p "require(process.env.RUNNER_TEMP + '/plan.json').planned" 2>/dev/null)" != true ]; then
            echo "::notice::No long video today: $(node -p "require(process.env.RUNNER_TEMP + '/plan.json').why" 2>/dev/null)"
          else
            echo "GO=1" >> "$GITHUB_ENV"
          fi

      - name: Restore today's story and images
        if: env.GO == '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            story/long/scenes.json
            story/long/images
            story/long/tries
          key: long-${{ steps.date.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: long-${{ steps.date.outputs.today }}-

      - name: Attempts
        id: tries
        if: env.GO == '1'
        run: |
          mkdir -p story/long
          n=$(( $(cat story/long/tries 2>/dev/null || echo 0) + 1 ))
          echo $n > story/long/tries
          if [ $n -gt 3 ]; then
            echo "::warning::The long video failed 3 times today; trying again tomorrow"
            echo "GO=0" >> "$GITHUB_ENV"; exit 0
          fi
          # A story written by an earlier attempt today is reused, with its cached images.
          if [ -f story/long/scenes.json ] && node -e "process.exit(require('./story/long/scenes.json').slug.startsWith('${{ steps.date.outputs.today }}-long-') ? 0 : 1)"; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf story/long/scenes.json story/long/images
          fi

      - uses: actions/setup-python@v5
        if: env.GO == '1'
        with:
          python-version: '3.12'

      - name: Tools
        if: env.GO == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q kokoro-onnx==0.6.1 soundfile==0.14.0 edge-tts

      - name: Cache Kokoro model
        if: env.GO == '1'
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-v1.0

      - name: Download Kokoro model
        if: env.GO == '1'
        run: |
          mkdir -p .kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f .kokoro/kokoro-v1.0.onnx ] || curl -sSL -o .kokoro/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f .kokoro/voices-v1.0.bin ] || curl -sSL -o .kokoro/voices-v1.0.bin $base/voices-v1.0.bin

      - name: Write the long story
        if: env.GO == '1' && steps.tries.outputs.have != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/validate.mjs:*),Bash(ls:*),Bash(mkdir -p story/long)"
          prompt: |
            Write today's Shyam Premi SN LONG katha video. Today's date (IST) is ${{ steps.date.outputs.today }}, slot: long.
            Follow automation/STORY.md exactly: sections 1-2 for choosing and researching the subject, and section 5
            "Long video" for everything else. Today's trend research is automation/trends/${{ steps.date.outputs.today }}.md
            (if it is missing, the newest file in automation/trends/): read its first 100 lines and prefer a "long part" topic
            from it when it fits the section 5 subject order. Today's plan (scripts/day-plan.mjs) for this video:
            ${{ steps.date.outputs.what || 'follow the section 5 subject order' }}.
            Narrate in the warm spoken style of STORY.md "Spoken
            style" (short sentences, max 18 words, like telling the katha to family). Write story/long/scenes.json and make
            `node scripts/validate.mjs story/long/scenes.json` pass. You may add confirmed festivals to
            automation/calendar.md. Change nothing else (do not edit automation/log.md: the workflow records it).
            Use the Write tool for the file (the directory story/long already exists); shell commands other than
            the validator and ls are not available.

      # When the story is missing, show Claude's own words and any refused tool calls (no tool output) so
      # the cause can be fixed without exposing anything else in this public log.
      - name: Why is the story missing
        if: env.GO == '1' && steps.tries.outputs.have != 'true' && hashFiles('story/long/scenes.json') == ''
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          [ -f "$f" ] && node -e '
            const msgs = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            for (const m of msgs) {
              if (m.type === "result") console.log("DENIED:", JSON.stringify((m.permission_denials || []).map((d) => ({ tool: d.tool_name, input: String(JSON.stringify(d.tool_input)).slice(0, 160) }))));
              if (m.type !== "assistant") continue;
              for (const c of m.message?.content || []) {
                if (c.type === "text") console.log("SAID:", c.text.slice(0, 400));
                if (c.type === "tool_use") console.log("TOOL:", c.name, String(c.input?.file_path || c.input?.command || "").slice(0, 120));
              }
            }' "$f"
          echo "::error::Claude did not write story/long/scenes.json"; exit 1

      - name: Validate
        if: env.GO == '1'
        run: |
          node scripts/validate.mjs --long --soft-topics story/long/scenes.json
          slug=$(node -p "require('./story/long/scenes.json').slug")
          case "$slug" in "${{ steps.date.outputs.today }}-long-"*) ;; *) echo "::error::Unexpected slug $slug"; exit 1;; esac
          echo "SLUG=$slug" >> "$GITHUB_ENV"

      - name: Real temple photos
        if: env.GO == '1'
        continue-on-error: true
        run: node scripts/real-photos.mjs --spec story/long/scenes.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Chatterbox narration for the long video on the Kaggle GPU (kernel sps-tts-long, ~5 min for 5-6 min of speech),
      # only when the repo variable SHYAM_TTS is "chatterbox" (off: see the Render note in the story job).
      # Any failure, a busy Kaggle or under 3 GPU hours left: edge-tts makes the voice in the Render step instead.
      - name: Voice (Kaggle GPU)
        if: env.GO == '1' && vars.SHYAM_TTS == 'chatterbox'
        continue-on-error: true
        timeout-minutes: 60
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: long
        run: |
          fail() { echo "::warning::Chatterbox voice skipped, using edge-tts: $1"; exit 1; }
          [ -n "$KAGGLE_API_TOKEN" ] || fail "no KAGGLE_API_TOKEN secret"
          pip install -q 'kaggle>=2.2' six || fail "kaggle CLI install failed"
          node animate/kaggle.mjs quota --min 3 > "$RUNNER_TEMP/quota.json" || fail "under 3 Kaggle GPU hours left ($(cat "$RUNNER_TEMP/quota.json"))"
          node animate/kaggle.mjs prepare story/long/scenes.json --voice --max 0 || fail "dataset upload failed"
          node animate/kaggle.mjs lock --minutes 15 || fail "another sps kernel is still running"
          node animate/kaggle.mjs push --queue-minutes 15 --retry-minutes 15 || fail "kernel push failed (Kaggle busy?)"
          node animate/kaggle.mjs wait --minutes 40 --queue-minutes 15 > "$RUNNER_TEMP/wait.json" || fail "Kaggle: $(cat "$RUNNER_TEMP/wait.json")"
          node animate/kaggle.mjs fetch --to story/long/clips --voice-to story/long/voice | tee "$RUNNER_TEMP/fetch.json"
          echo "- Long voice: $(cat "$RUNNER_TEMP/fetch.json")" >> "$GITHUB_STEP_SUMMARY"

      # Images (animate/frames.mjs --long --kaggle-first): cached per day; else FLUX.1-schnell on the Kaggle GPU
      # (sps-frames-long, ~6 min + ~1 min per image), then Workers AI for anything Kaggle did not make. Kaggle first because
      # the long video's ~12 images (~4k of the 10k daily neurons) would otherwise starve the evening/status Shorts.
      # The renderer covers anything left with a bank / photo stand-in.
      - name: Images (Workers AI, else Kaggle FLUX)
        if: env.GO == '1'
        continue-on-error: true
        timeout-minutes: 50
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: long
        run: |
          [ -n "$KAGGLE_API_TOKEN" ] && pip install -q 'kaggle>=2.2' six
          node animate/frames.mjs story/long/scenes.json --long --kaggle-first --wait 45

      - name: Render
        id: render
        if: env.GO == '1'
        env:
          VOICE_DIR: story/long/voice
        run: node story/render-long.mjs story/long/scenes.json

      - name: Save today's story and images
        if: always() && env.GO == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            story/long/scenes.json
            story/long/images
            story/long/tries
          key: long-${{ steps.date.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the video as an artifact (7 days)
        if: steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: long-${{ env.SLUG }}
          path: story/long/out/
          retention-days: 7
          compression-level: 0

      # Festival card links (scripts/festival-links.mjs, e.g. the Janmotsav card 17-20 Nov 2026), only while the page is live.
      - name: Festival links
        if: steps.render.outcome == 'success'
        continue-on-error: true
        run: node scripts/festival-links.mjs story/long/scenes.json --day "${{ steps.date.outputs.today }}" --slot long

      - name: Claim the upload
        id: claim
        if: steps.render.outcome == 'success'
        run: node scripts/upload-guard.mjs claim --day "${{ steps.date.outputs.today }}" --slot long --slug "$SLUG"

      - name: YouTube
        id: yt
        if: steps.render.outcome == 'success' && steps.claim.outputs.go == 'true'
        continue-on-error: true
        run: |
          node scripts/youtube.mjs upload --long --video "story/long/out/$SLUG.mp4" --scenes story/long/scenes.json \
            --meta "story/long/out/$SLUG.json" --thumbnail "story/long/out/$SLUG-thumb.jpg" --publish-at 12:30 | tee "$RUNNER_TEMP/yt.json"

      # The same video as a normal Facebook Page feed video (not a Reel; resumable chunked upload), 12:30 IST like YouTube; its line in
      # published.md is committed by Record. Never fails the job; skipped without the META_* secrets.
      - name: Facebook Page video (Graph API)
        if: steps.render.outcome == 'success' && steps.claim.outputs.go == 'true'
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          [ -n "$META_PAGE_TOKEN" ] || { echo "::notice::META_* secrets not set; no Facebook copy"; exit 0; }
          grep -q '"duplicate":true' "$RUNNER_TEMP/yt.json" 2>/dev/null && { echo "::notice::YouTube already had it (earlier run): no second Facebook copy"; exit 0; }
          # Facebook plan (scripts/fb.mjs, owner 13 Nov 2026): the long katha is a daily FEED video at 12:30 IST, not one of
          # the 2 Reels a day; fb.mjs gives its time ("--fb-at <date>T12:30", "--fb-at now" when 12:30 has passed and it
          # is under 6 h late, else --no-fb).
          fb=$(node scripts/fb.mjs flags --date "${{ steps.date.outputs.today }}" --slot long || echo --no-fb)
          if [ "$fb" = --no-fb ]; then echo "::notice::Facebook plan: no Facebook copy of this long video"; exit 0; fi
          at=${fb#--fb-at }; pa=(); [ "$at" = now ] || pa=(--publish-at "$at")
          node scripts/meta.mjs long --video "story/long/out/$SLUG.mp4" --scenes story/long/scenes.json --meta "story/long/out/$SLUG.json" \
            --thumbnail "story/long/out/$SLUG-thumb.jpg" "${pa[@]}" | tee "$RUNNER_TEMP/fb.json" || true
          echo "- $SLUG | facebook: $(node -p "try{const j=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/fb.json','utf8'));j.facebook?j.facebook.url+(j.facebook.scheduled?' (scheduled '+j.facebook.scheduled+')':''):'error '+(j.error||j.status)}catch{'failed'}")" >> automation/published.md
          grep -q '"status":"ok"' "$RUNNER_TEMP/fb.json" || echo "::warning::Facebook Page video failed: $(head -c 300 "$RUNNER_TEMP/fb.json")"

      - name: Park the video for a retry
        if: steps.yt.outcome == 'failure'
        continue-on-error: true
        run: |
          reason=$(node -p "try{const j=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/yt.json','utf8'));(j.status==='quota'?'quota: ':'')+(j.error||'failed')}catch{'failed'}")
          node scripts/long-pending.mjs keep "$SLUG" "$reason"

      - name: Record
        if: always() && steps.render.outcome == 'success' && steps.claim.outputs.go == 'true'
        run: |
          mkdir -p story/published
          cp story/long/scenes.json "story/published/$SLUG.json"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('story/long/out/$SLUG.json','utf8'));delete m.video;delete m.thumbnail;fs.writeFileSync('story/published/$SLUG.meta.json',JSON.stringify(m,null,2)+'\n')"
          line=$(node -e "
            const fs=require('fs'); const s=require('./story/long/scenes.json'); const m=require('./story/long/out/$SLUG.json');
            let y={}; try { y=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/yt.json','utf8')); } catch {}
            const len=Math.floor(m.seconds/60)+':'+String(Math.floor(m.seconds%60)).padStart(2,'0');
            const yt=y.youtube ? y.youtube.url+(y.youtube.publishAt?' (public at 12:30 IST)':'')+(y.youtube.thumbnailError?' (thumbnail failed: '+y.youtube.thumbnailError.slice(0,80)+')':'') : 'pending, retried next run ('+(y.status||'failed')+')';
            const out={log:'${{ steps.date.outputs.today }} | long | '+s.slug+' | '+s.deity+' | '+s.summary,
              pub:'- '+s.slug+' | youtube: '+yt+' | long '+len+', '+m.scenes+' scenes, render '+Math.round(m.render_seconds/60)+' min, '+m.neurons+' neurons',
              sum:'### Long video '+s.slug+'\n\n- Length: '+len+' ('+m.scenes+' scenes, '+m.chapters.length+' chapters)\n- Render: '+m.render_seconds+' s\n- Images: '+m.images+' ('+m.images_generated+' generated, ~'+m.neurons+' neurons)\n- YouTube: '+yt+'\n- Artifact: long-'+s.slug+' (7 days)\n'};
            fs.writeFileSync(process.env.RUNNER_TEMP+'/sum.md', out.sum); console.log(JSON.stringify(out));")
          echo "$line" | node -e "const o=JSON.parse(require('fs').readFileSync(0,'utf8'));require('fs').appendFileSync('automation/log.md',o.log+'\n');require('fs').appendFileSync('automation/published.md',o.pub+'\n')"
          cat "$RUNNER_TEMP/sum.md" >> "$GITHUB_STEP_SUMMARY"
          git add automation "story/published/$SLUG.json" "story/published/$SLUG.meta.json" footage
          git commit -qm "Long $SLUG"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i * 10)); done

      - name: Report a failed upload
        if: steps.yt.outcome == 'failure'
        run: |
          if grep -q '"status":"quota"' "$RUNNER_TEMP/yt.json" 2>/dev/null; then
            echo "::warning::YouTube quota exceeded: the video is parked on the media Worker and retried next run"
          else
            echo "::error::YouTube upload failed: $(cat "$RUNNER_TEMP/yt.json" 2>/dev/null)"; exit 1
          fi

  # Festival status Shorts (scripts/status-engine.mjs, automation/festivals.json; owner, 11 Nov 2026): the one format that
  # went viral (Choti Diwali Status 2026: 798 views; Dhanteras Status 456). After every evening-slot run (and alone with
  # slot=status) the engine picks ONE festival with variants due: today's `eve` (public 20:00 IST, when people pick
  # tomorrow's WhatsApp status), tomorrow's `status` (00:30 IST) and, for big festivals, `statusday` (08:30 IST). The
  # festival's base spec (story/status/<date>.json, else its theme in scripts/status-themes.mjs) gets its pictures and
  # Kaggle clips ONCE; each variant reuses them with its own bold Hindi hook, picture order and title ("<Festival> Status
  # 2026 | <Hindi> स्टेटस वीडियो #Shorts"), is rendered as a 15-25 s loop (story/render-story.mjs `loop`), hosted on the
  # media Worker (7-day download link in the description), uploaded private with publishAt (a late `eve` goes out at
  # once), scheduled as a Facebook Reel and queued for Instagram (the `instagram` job). Only variants that fit the
  # 3-a-day cap exist (scripts/day-plan.mjs), and scripts/upload-guard.mjs claims "<day> <slot>" before each upload.
  status:
    needs: story
    if: always() && needs.story.outputs.status == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Evening runs and slot=status dispatches are in different workflow queues; this job queues per day so two runs never
    # make the same status Short at once (7 Nov 2026: Diwali uploaded twice). A queued run then skips via log.md.
    concurrency:
      group: shyam-status-${{ needs.story.outputs.status_day }}
      cancel-in-progress: false
    env:
      FFMPEG_PATH: ffmpeg
      PYTHON: python
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
      SUB_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      MEDIA_URL: https://shyam-premi-media.sk9836413.workers.dev
      MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
      KALYUG: ${{ vars.KALYUG }}
      W: story/status/work
      SPS_WORKERS_AI: ${{ inputs.force_fallback && '0' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # What is due now (scripts/status-engine.mjs due): variants of one festival, minus those already in log.md, those the
      # 3-a-day cap dropped and those whose time has passed. slot=status + status_date = all variants of that festival.
      - name: Festival status variants due
        id: d
        run: |
          git fetch -q origin main && git checkout -q origin/main -- automation/log.md
          fam="${{ inputs.status_date }}"
          node scripts/status-engine.mjs due ${fam:+--family "$fam"} ${{ inputs.dry_run && '--dry' || '' }} --out "$RUNNER_TEMP/status" > "$RUNNER_TEMP/due.out"
          node -e 'const d=require(process.argv[1]); console.log(`- Status engine (${d.now_ist} IST): ${d.variants.length ? d.variants.map((v) => `${v.day} ${v.at} ${v.slot} "${v.title}"`).join("; ") : "nothing due"}${d.skipped.length ? `; skipped: ${d.skipped.join("; ")}` : ""}`)' "$RUNNER_TEMP/status/due.json" | tee -a "$GITHUB_STEP_SUMMARY"
          day=$(node -p "require('$RUNNER_TEMP/status/due.json').family || ''")
          [ -n "$day" ] || { echo "::notice::No festival status Short due now"; exit 0; }
          echo "GO=1" >> "$GITHUB_ENV"
          echo "SLUG=$(node -p "require('$RUNNER_TEMP/status/due.json').base_slug")" >> "$GITHUB_ENV"

      - name: Restore the day's images and clips
        if: env.GO == '1'
        uses: actions/cache/restore@v4
        with:
          path: story/status/work
          key: status-${{ steps.d.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: status-${{ steps.d.outputs.day }}-

      # The festival's base spec is the source of truth; accepted clips from an earlier run (the evening before, a dry run)
      # are kept when their scene's prompt is unchanged. The base itself is never uploaded; its variants are validated.
      - name: Spec
        if: env.GO == '1'
        run: |
          mkdir -p "$W"
          node -e '
            const fs = require("fs"), [src, dst] = process.argv.slice(1);
            const spec = JSON.parse(fs.readFileSync(src, "utf8"));
            let old = null; try { old = JSON.parse(fs.readFileSync(dst, "utf8")); } catch {}
            let kept = 0;
            if (old && old.slug === spec.slug) spec.scenes.forEach((sc, i) => {
              const o = old.scenes[i];
              if (o && o.video && o.prompt === sc.prompt && fs.existsSync(require("path").join(require("path").dirname(dst), o.video))) { sc.video = o.video; kept++; }
            });
            fs.writeFileSync(dst, JSON.stringify(spec, null, 2) + "\n");
            console.log(JSON.stringify({ slug: spec.slug, clips_kept: kept }));
            if (kept) fs.appendFileSync(process.env.GITHUB_ENV, "HAVE_CLIPS=1\n");' "$RUNNER_TEMP/status/family.json" "$W/scenes.json"

      - uses: actions/setup-python@v5
        if: env.GO == '1'
        with:
          python-version: '3.12'

      - name: Tools
        if: env.GO == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-color-emoji > /dev/null
          pip install -q kokoro-onnx==0.6.1 soundfile==0.14.0 edge-tts
          echo "CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      - name: Cache Kokoro model
        if: env.GO == '1'
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-v1.0

      - name: Download Kokoro model
        if: env.GO == '1'
        run: |
          mkdir -p .kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f .kokoro/kokoro-v1.0.onnx ] || curl -sSL -o .kokoro/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f .kokoro/voices-v1.0.bin ] || curl -sSL -o .kokoro/voices-v1.0.bin $base/voices-v1.0.bin

      # Images (animate/frames.mjs): cached per festival day; else Workers AI, else FLUX.1-schnell on the Kaggle GPU
      # (sps-frames-status). Whatever is still missing gets a bank / real photo / plain stand-in in the renderer.
      - name: Images (Workers AI, else Kaggle FLUX)
        if: env.GO == '1'
        continue-on-error: true
        timeout-minutes: 50
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: status
        run: |
          [ -n "$KAGGLE_API_TOKEN" ] && pip install -q 'kaggle>=2.2' six
          node animate/frames.mjs "$W/scenes.json" --wait 40

      # Same Kaggle path as the evening Short (Wan 2.2 TI2V-5B, private kernel sps-animate-status, T4 x2), only for the
      # base scenes marked `animate` (max 3) and only when no accepted clips are cached yet. Any failure: FLUX still + zoompan.
      - name: Animate (Kaggle GPU)
        if: env.GO == '1' && env.HAVE_CLIPS != '1'
        continue-on-error: true
        timeout-minutes: 150
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: status
          SPS_FLUX: ${{ vars.SPS_FLUX }}
          SPS_ENHANCE: ${{ vars.SPS_ENHANCE }}
        run: |
          fail() { echo "::warning::Animation skipped, using zoompan: $1"; echo "- Animation skipped: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ -n "$KAGGLE_API_TOKEN" ] || fail "no KAGGLE_API_TOKEN secret"
          pip install -q 'kaggle>=2.2' six || fail "kaggle CLI install failed"
          node animate/kaggle.mjs quota --min 3 > "$RUNNER_TEMP/quota.json" || fail "under 3 Kaggle GPU hours left this week ($(cat "$RUNNER_TEMP/quota.json"))"
          node story/render-story.mjs "$W/scenes.json" --prepare || fail "FLUX images / narration failed"
          plan="$W/build/$SLUG/plan.json"
          node animate/kaggle.mjs prepare "$W/scenes.json" --plan "$plan" --max 3 || fail "dataset upload failed"
          node animate/kaggle.mjs lock --minutes 60 || fail "another sps kernel is still running after 60 min"
          node animate/kaggle.mjs push --queue-minutes 20 --retry-minutes 30 || fail "kernel push failed (Kaggle busy?)"
          start=$(date +%s)
          node animate/kaggle.mjs wait --minutes 110 --queue-minutes 20 > "$RUNNER_TEMP/wait.json" || echo "::warning::Kaggle: $(cat "$RUNNER_TEMP/wait.json"); using any clips it finished"
          grep -q QUEUED_TOO_LONG "$RUNNER_TEMP/wait.json" && fail "the Kaggle GPU session was still queued after 20 min"
          node animate/kaggle.mjs fetch --to "$W/clips" --stills-to "$W/stills" > "$RUNNER_TEMP/fetch.json" || fail "could not download the clips"
          echo "- Kaggle: $(cat "$RUNNER_TEMP/fetch.json"), waited $(( ($(date +%s) - start) / 60 )) min, quota before: $(cat "$RUNNER_TEMP/quota.json")" >> "$GITHUB_STEP_SUMMARY"
          node animate/check-clips.mjs "$W/scenes.json" --clips "$W/clips" --plan "$plan" --stills "$W/stills" --summary "$GITHUB_STEP_SUMMARY"

      - name: Save the day's images and clips
        if: always() && env.GO == '1'
        uses: actions/cache/save@v4
        with:
          path: story/status/work
          key: status-${{ steps.d.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      # One variant at a time: spec (status-engine variants) -> validate -> render (loop) -> host + download link ->
      # festival links (17-20 Nov Janmotsav card) -> claim -> YouTube (publishAt) -> Facebook Reel + Instagram queue ->
      # log.md / published.md (committed per variant). A failed variant releases its claim; the others still go out.
      - name: Variants (render, host, upload, record)
        id: variants
        if: env.GO == '1'
        env:
          # each variant scene points at the base's upscaled still itself (scene.image); no index-based stills lookup
          STILLS_DIR: story/status/work/no-stills
          DRY: ${{ inputs.dry_run }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          node scripts/status-engine.mjs variants --base "$W/scenes.json" --due "$RUNNER_TEMP/status/due.json" > "$RUNNER_TEMP/variants.tsv"
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          j() { node -p "try{const j=JSON.parse(require('fs').readFileSync('$1','utf8'));$2}catch{''}"; }
          variant() {
            local file="$1" slug="$2" day="$3" slot="$4" at="$5"
            node scripts/validate.mjs --soft-topics "$file" || { echo "::error::$slug failed validation"; return 1; }
            node story/render-story.mjs "$file" > "$RUNNER_TEMP/render.txt" 2>&1 || { tail -30 "$RUNNER_TEMP/render.txt"; echo "::error::$slug render failed"; return 1; }
            tail -3 "$RUNNER_TEMP/render.txt"
            echo "- $slug: $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$W/out/$slug.mp4") s, public $day $at IST" >> "$GITHUB_STEP_SUMMARY"
            node scripts/publish.mjs --host-only --video "$W/out/$slug.mp4" --scenes "$file" > "$RUNNER_TEMP/host.json" || true
            url=$(j "$RUNNER_TEMP/host.json" "j.video_url||''")
            # Hosting is not worth losing the post (11 Nov 2026: the media Worker answered HTTP 429 at night): without it the
            # Short still goes to YouTube and Facebook, only the download link and the Instagram Reel are missing.
            if [ -z "$url" ]; then
              echo "::warning::$slug: media upload failed ($(head -c 200 "$RUNNER_TEMP/host.json")): no download link, no Instagram Reel"
            else
              node -e '
                const fs = require("fs"), [f, url] = process.argv.slice(1), s = JSON.parse(fs.readFileSync(f, "utf8"));
                const line = `Status video download karein (7 din tak, free): ${url}`;
                for (const k of ["youtube_description", "instagram_caption", "facebook_caption"])
                  if (s[k] && !s[k].includes(url)) s[k] = /\n\n/.test(s[k]) ? s[k].replace(/\n\n/, `\n\n${line}\n\n`) : `${s[k]}\n\n${line}`;
                fs.writeFileSync(f, JSON.stringify(s, null, 2) + "\n");' "$file" "$url"
            fi
            node scripts/festival-links.mjs "$file" || true
            if [ "$DRY" = true ]; then
              node scripts/youtube.mjs upload --video "$W/out/$slug.mp4" --scenes "$file" --publish-at "${day}T${at}" --dry-run > "$RUNNER_TEMP/yt-dry.json" || true
              echo "  - dry run: would upload \"$(j "$RUNNER_TEMP/yt-dry.json" "j.title")\" with publishAt $(j "$RUNNER_TEMP/yt-dry.json" "j.publishAt||'now'"); download $url" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            node scripts/upload-guard.mjs claim --day "$day" --slot "$slot" --slug "$slug" > "$RUNNER_TEMP/claim.json"
            grep -q '"go":true' "$RUNNER_TEMP/claim.json" || { echo "::notice::$slug not uploaded: $(head -c 300 "$RUNNER_TEMP/claim.json")"; return 0; }
            if ! node scripts/youtube.mjs upload --video "$W/out/$slug.mp4" --scenes "$file" --publish-at "${day}T${at}" > "$RUNNER_TEMP/yt.json" || ! grep -q '"status":"ok"' "$RUNNER_TEMP/yt.json"; then
              echo "::error::$slug: YouTube upload failed: $(head -c 300 "$RUNNER_TEMP/yt.json")"
              node scripts/upload-guard.mjs release --day "$day" --slot "$slot" --slug "$slug" --reason "YouTube upload failed"
              return 1
            fi
            rm -f "$RUNNER_TEMP/meta.json"
            if [ -n "$META_PAGE_TOKEN" ] && ! grep -q '"duplicate":true' "$RUNNER_TEMP/yt.json"; then
              # Facebook: only the day's chosen status Reel (scripts/fb.mjs), at the status time; Instagram as before.
              fb=$(node scripts/fb.mjs flags --date "$day" --slot "$slot" --festival-date "$(j "$file" "j.festival_date||''")" || echo --no-fb)
              node scripts/meta.mjs short --video "$W/out/$slug.mp4" --scenes "$file" ${url:+--video-url "$url"} --publish-at "${day}T${at}" $fb > "$RUNNER_TEMP/meta.json" || true
            fi
            mkdir -p story/published
            cp "$file" "story/published/$slug.json"
            yt=$(j "$RUNNER_TEMP/yt.json" "const y=j.youtube; y.url+(y.publishAt?' (public at '+y.publishAt+')':' (public now)')")
            fest=$(j "$file" "j.festival")
            social=$(j "$RUNNER_TEMP/meta.json" "' | social: '+j.summary")
            echo "$day | $slot | $slug | $fest | status Short variant $(j "$file" "j.variant") \"$(j "$file" "j.youtube_title.split(' | ')[0]")\" (15-25 s loop, download link), public $at IST" >> automation/log.md
            echo "- $slug | youtube: $yt | status variant, made $(TZ=Asia/Kolkata date '+%d %b %H:%M') IST$social" >> automation/published.md
            git add automation/log.md automation/published.md "story/published/$slug.json"
            git commit -qm "Status $slug"
            for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i * 10)); done
            echo "  - uploaded: $yt$social" >> "$GITHUB_STEP_SUMMARY"
          }
          failed=0
          while IFS=$'\t' read -r file slug day slot at; do
            [ -n "$slug" ] || continue
            echo "::group::$slug ($day $slot $at)"
            variant "$file" "$slug" "$day" "$slot" "$at" < /dev/null || failed=1
            echo "::endgroup::"
          done < "$RUNNER_TEMP/variants.tsv"
          exit $failed

      - name: Keep the videos as an artifact (7 days)
        if: always() && env.GO == '1'
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ steps.d.outputs.day }}-${{ github.run_id }}
          path: |
            story/status/work/out/
            story/status/work/v-*.json
            story/status/work/scenes.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore

  # Bhajan Short (owner, 13 Nov 2026: original Chhath bhajans, 2-3 a day 13-16 Nov; scripts/bhajan-short.mjs,
  # automation/chhath-2026.json): a QA-passed library bhajan is the whole soundtrack (from its chorus, 45-90 s, no
  # narration) over licence-safe bank pictures (brand/photo-bank/chhath, no faces). Runs on the GitHub runner only: no
  # Claude, no Workers AI, no Kaggle (so the 18:30-21:00 IST Kaggle window does not matter). slot=bhajan (the extra Short
  # of EXTRA_UPLOAD_DAY) or a morning/evening slot that day-plan turned into a bhajan Short. Same guard/record path as the
  # status Shorts: validate -> render -> host -> upload-guard claim -> YouTube (publishAt) -> Facebook Reel + Instagram
  # queue -> log.md / published.md / story/published (the bhajan's 5-day history).
  bhajan:
    needs: story
    if: always() && needs.story.outputs.bhajan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: shyam-bhajan-${{ needs.story.outputs.today }}-${{ needs.story.outputs.bhajan_slot }}
      cancel-in-progress: false
    env:
      FFMPEG_PATH: ffmpeg
      SUB_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      MEDIA_URL: https://shyam-premi-media.sk9836413.workers.dev
      MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
      W: story/bhajan/work
      DAY: ${{ needs.story.outputs.today }}
      SLOT: ${{ needs.story.outputs.bhajan_slot }}
      DRY: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Already published?
        run: |
          if grep -q "^$DAY | $SLOT |" automation/log.md; then echo "::notice::$DAY $SLOT already published"; echo "SKIP=1" >> "$GITHUB_ENV"; fi

      - name: Tools
        if: env.SKIP != '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-color-emoji > /dev/null
          echo "CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      - name: Spec, validate, render
        if: env.SKIP != '1'
        run: |
          mkdir -p "$W"
          node scripts/bhajan-short.mjs build --date "$DAY" --slot "$SLOT" --out "$W/scenes.json" | tee "$RUNNER_TEMP/build.json"
          node scripts/validate.mjs --soft-topics "$W/scenes.json"
          SLUG=$(node -p "require('./$W/scenes.json').slug")
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          AT=$(node -p "require('$RUNNER_TEMP/build.json').publish_at")
          echo "AT=$AT" >> "$GITHUB_ENV"
          echo "FBAT=$(node -p "require('$RUNNER_TEMP/build.json').fb")" >> "$GITHUB_ENV"
          node story/render-story.mjs "$W/scenes.json" > "$RUNNER_TEMP/render.txt" 2>&1 || { tail -40 "$RUNNER_TEMP/render.txt"; exit 1; }
          tail -8 "$RUNNER_TEMP/render.txt"
          test -s "$W/out/$SLUG.mp4"
          echo "- Bhajan Short $SLUG: $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$W/out/$SLUG.mp4") s, bhajan $(node -p "require('$RUNNER_TEMP/build.json').bhajan"), public ${AT:-now} IST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload (guard, YouTube, Facebook, Instagram) and record
        if: env.SKIP != '1'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          file="$W/scenes.json"; video="$W/out/$SLUG.mp4"
          j() { node -p "try{const j=JSON.parse(require('fs').readFileSync('$1','utf8'));$2}catch{''}"; }
          pa=(); [ -n "$AT" ] && pa=(--publish-at "${DAY}T${AT}")
          if [ "$DRY" = true ]; then
            node scripts/youtube.mjs upload --video "$video" --scenes "$file" "${pa[@]}" --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/publish.mjs --host-only --video "$video" --scenes "$file" > "$RUNNER_TEMP/host.json" || true
          url=$(j "$RUNNER_TEMP/host.json" "j.video_url||''")
          [ -n "$url" ] || echo "::warning::media upload failed ($(head -c 200 "$RUNNER_TEMP/host.json")): no Instagram Reel"
          node scripts/upload-guard.mjs claim --day "$DAY" --slot "$SLOT" --slug "$SLUG" > "$RUNNER_TEMP/claim.json"
          grep -q '"go":true' "$RUNNER_TEMP/claim.json" || { echo "::notice::$SLUG not uploaded: $(head -c 300 "$RUNNER_TEMP/claim.json")"; exit 0; }
          if ! node scripts/youtube.mjs upload --video "$video" --scenes "$file" "${pa[@]}" > "$RUNNER_TEMP/yt.json" || ! grep -q '"status":"ok"' "$RUNNER_TEMP/yt.json"; then
            echo "::error::YouTube upload failed: $(head -c 300 "$RUNNER_TEMP/yt.json")"
            node scripts/upload-guard.mjs release --day "$DAY" --slot "$SLOT" --slug "$SLUG" --reason "YouTube upload failed"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/meta.json"
          if [ -n "$META_PAGE_TOKEN" ] && ! grep -q '"duplicate":true' "$RUNNER_TEMP/yt.json"; then
            if [ -n "$FBAT" ]; then fb="--fb-at ${DAY}T${FBAT}"; else fb=$(node scripts/fb.mjs flags --date "$DAY" --slot "$SLOT" || echo --no-fb); fi
            node scripts/meta.mjs short --video "$video" --scenes "$file" ${url:+--video-url "$url"} "${pa[@]}" $fb > "$RUNNER_TEMP/meta.json" || true
          fi
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p story/published
          node -e 'const fs=require("fs"),p=require("path"),s=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const sc of s.scenes)if(sc.image)sc.image=p.relative(process.cwd(),sc.image);fs.writeFileSync(process.argv[2],JSON.stringify(s,null,2)+"\n")' "$file" "story/published/$SLUG.json"
          yt=$(j "$RUNNER_TEMP/yt.json" "const y=j.youtube; y.url+(y.publishAt?' (public at '+y.publishAt+')':' (public now)')")
          social=$(j "$RUNNER_TEMP/meta.json" "' | social: '+j.summary")
          echo "$DAY | $SLOT | $SLUG | $(j "$file" "j.festival") | Chhath bhajan Short \"$(j "$file" "j.youtube_title.split(' | ')[0]")\", song $(j "$file" "j.bhajan_id") (AI-sung original, whole soundtrack), public ${AT:-on upload} IST" >> automation/log.md
          echo "- $SLUG | youtube: $yt | bhajan Short, made $(TZ=Asia/Kolkata date '+%d %b %H:%M') IST$social" >> automation/published.md
          git add automation/log.md automation/published.md "story/published/$SLUG.json"
          git commit -qm "Bhajan Short $SLUG"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i * 10)); done
          echo "- uploaded: $yt$social" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the video as an artifact (7 days)
        if: always() && env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: bhajan-${{ needs.story.outputs.today }}-${{ needs.story.outputs.bhajan_slot }}-${{ github.run_id }}
          path: |
            story/bhajan/work/out/
            story/bhajan/work/scenes.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore

  # Mini-movie series (STORY.md section 7, story/movies/<series>/, automation/movie-series.md): after every evening-slot
  # run (and alone with slot=movie) the next due part is made a day or more before its release: edge-tts voices per
  # character, ONE Kaggle session (story/movie_kernel.py: FLUX frames, Wan clips, lip-sync, Whisper pronunciation check;
  # the GPU tier from the quota keeps the daily Shorts' hours, animate/REPORT.md section 11), render, then YouTube private
  # with publishAt <release> 07:00, Facebook scheduled, Instagram queued. That part is the morning Short of its release
  # day ("Movie morning" in the story job). A series the owner has not approved ("approved": false in series.json) is
  # rendered and parked for review only (artifact + media Worker link in published.md), never uploaded.
  movie:
    needs: story
    if: always() && needs.story.outputs.movie == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: shyam-movie
      cancel-in-progress: false
    env:
      FFMPEG_PATH: ffmpeg
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
      MEDIA_URL: https://shyam-premi-media.sk9836413.workers.dev
      MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
      W: story/movies/work
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Due part
        id: d
        run: |
          git fetch -q origin main && git checkout -q origin/main -- automation/log.md automation/published.md
          node scripts/movie-due.mjs --part "${{ inputs.movie_part }}" --daily "${{ vars.MOVIE_DAILY }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.d.outputs.mode == 'produce' || steps.d.outputs.mode == 'write'
        with:
          python-version: '3.12'

      # Daily pipeline (repo variable MOVIE_DAILY=on, after the owner approved the format): Claude writes tomorrow's part
      # of the active series in automation/movie-series.md, or starts the next series there.
      - name: Write the movie part
        id: write
        if: steps.d.outputs.mode == 'write'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 140
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/validate.mjs:*),Bash(ls:*)"
          prompt: |
            Write the next Shyam Premi SN mini-movie part. Its release day (IST) is ${{ steps.d.outputs.release }} at 07:00.
            Follow automation/STORY.md section 7 exactly (and sections 1-2 for research and accuracy), with the queue in
            automation/movie-series.md and the characters in characters/cast/cast.json. Lines follow STORY.md "Spoken style"
            (natural spoken Hindi, short sentences, max 18 words). Write story/movies/<series>/series.json
            (when the series starts) and story/movies/<series>/part-<n>.json, make `node scripts/validate.mjs <that file>` pass,
            and update the series' row in automation/movie-series.md. Change nothing else.

      - name: Spec
        id: spec
        if: steps.d.outputs.mode == 'produce' || steps.write.outcome == 'success'
        run: |
          f="${{ steps.d.outputs.file }}"
          [ -n "$f" ] || f=$(node scripts/movie-due.mjs --today "${{ steps.d.outputs.release }}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).file||""))')
          [ -n "$f" ] && [ -f "$f" ] || { echo "::error::No movie part file for ${{ steps.d.outputs.release }}"; exit 1; }
          node scripts/validate.mjs --soft-topics "$f"  # spoken-style warnings (long sentences) never stop a part
          node scripts/movie-due.mjs --part "$f" > "$RUNNER_TEMP/due.json"
          for k in slug release publish_at approved; do echo "$k=$(node -p "require(process.env.RUNNER_TEMP + '/due.json').$k")" >> "$GITHUB_OUTPUT"; done
          echo "SLUG=$(node -p "require(process.env.RUNNER_TEMP + '/due.json').slug")" >> "$GITHUB_ENV"
          echo "F=$f" >> "$GITHUB_ENV"

      - name: Tools
        if: steps.spec.outcome == 'success'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libfribidi0 libraqm0 > /dev/null
          pip install -q edge-tts pillow kokoro-onnx==0.6.1 soundfile==0.14.0 'kaggle>=2.2' six
          python -c "from PIL import features; print('raqm (Devanagari subtitles):', features.check('raqm'))"

      - name: Voices
        if: steps.spec.outcome == 'success'
        run: python -I story/movie.py voice --spec "$F" --out "$W/voice" | tee -a "$GITHUB_STEP_SUMMARY"

      # One Kaggle session per part. Tier from the quota (story/movie.py pick_tier): full (4 clips + a 14B hero clip),
      # standard (4 clips), lite (2 clips), stills (frames + lip-sync only); "none" = no GPU this time, the next evening
      # trigger tries again. Never under the daily Shorts' reserve. Repo variable MOVIE_TIER forces a tier.
      - name: Kaggle (frames, clips, lip-sync, pronunciation check)
        id: kaggle
        if: steps.spec.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 220
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: movie
        run: |
          [ -n "$KAGGLE_API_TOKEN" ] || { echo "::error::no KAGGLE_API_TOKEN secret"; exit 1; }
          if [ "${{ inputs.kaggle_reuse }}" = true ]; then  # re-render a finished session (e.g. after a renderer fix)
            node animate/kaggle.mjs fetch --to "$W/kaggle" | tee -a "$GITHUB_STEP_SUMMARY"
            node scripts/movie-qa.mjs "$W/kaggle/qa.json" >> "$GITHUB_STEP_SUMMARY" || true
            exit 0
          fi
          node animate/kaggle.mjs quota > "$RUNNER_TEMP/quota.json" || true
          python -I story/movie.py tier --spec "$F" --quota "$RUNNER_TEMP/quota.json" --force "${{ vars.MOVIE_TIER }}" | tee "$RUNNER_TEMP/tier.json"
          tier=$(node -p "require(process.env.RUNNER_TEMP + '/tier.json').tier")
          # "none": too few GPU hours before the weekly reset, or inside / too close to the daily jobs' windows (09:00-11:30 and
          # 18:30-21:00 IST, story/movie.py fit_window): the next evening trigger (e.g. 21:17 IST) tries again.
          [ "$tier" != none ] || { echo "::warning::No Kaggle slot for the movie now ($(cat "$RUNNER_TEMP/tier.json")); the next trigger tries again"; exit 1; }
          python -I story/movie.py dataset --spec "$F" --voice "$W/voice" --tier "$tier" --out animate/dataset --max-minutes 170
          node animate/kaggle.mjs upload
          node animate/kaggle.mjs lock --minutes 90
          node animate/kaggle.mjs push --queue-minutes 30 --retry-minutes 30
          start=$(date +%s)
          node animate/kaggle.mjs wait --minutes 200 --queue-minutes 30 > "$RUNNER_TEMP/wait.json" || echo "::warning::Kaggle: $(cat "$RUNNER_TEMP/wait.json")"
          node animate/kaggle.mjs fetch --to "$W/kaggle" | tee "$RUNNER_TEMP/fetch.json"
          echo "- Kaggle ($tier): $(cat "$RUNNER_TEMP/fetch.json"), waited $(( ($(date +%s) - start) / 60 )) min, quota before: $(cat "$RUNNER_TEMP/quota.json")" >> "$GITHUB_STEP_SUMMARY"
          node scripts/movie-qa.mjs "$W/kaggle/qa.json" >> "$GITHUB_STEP_SUMMARY" || true
          ls "$W/kaggle/frames" | grep -q '^s0' || { echo "::error::Kaggle made no frames"; exit 1; }

      - name: Render
        id: render
        if: steps.kaggle.outcome == 'success'
        run: |
          mkdir -p "$W/out/small"
          python -I story/movie.py keep --kaggle "$W/kaggle"
          # The lip-sync was made from the voice lines sent to Kaggle: render with exactly those.
          v="$W/voice"; [ -f "$W/kaggle/voice/voice.json" ] && v="$W/kaggle/voice"
          python -I story/movie.py render --spec "$F" --voice "$v" --kaggle "$W/kaggle" --out "$W/out/$SLUG.mp4" \
            --meta "$W/out/meta.json" --srt "$W/out/$SLUG.srt" --small "$W/out/small/$SLUG.mp4" | tee -a "$GITHUB_STEP_SUMMARY"
          ffprobe -v error -show_entries format=duration:stream=width,height -of compact "$W/out/$SLUG.mp4" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the video as an artifact (7 days)
        if: steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: movie-${{ env.SLUG }}
          path: |
            story/movies/work/out/
            story/movies/work/kaggle/qa.json
            story/movies/work/kaggle/results*.json
          retention-days: 7
          compression-level: 0

      # The 720p copy under 25 MB goes on the media Worker (7 days): Instagram publishes from that URL, and it is the
      # owner's review link while the series is not approved.
      - name: Host
        id: host
        if: steps.render.outcome == 'success'
        run: node scripts/publish.mjs --host-only --video "$W/out/small/$SLUG.mp4" --scenes "$F" | tee "$RUNNER_TEMP/host.json"

      - name: Park for review (series not approved yet)
        if: steps.render.outcome == 'success' && (steps.spec.outputs.approved != 'true' || inputs.dry_run)
        run: |
          url=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/host.json', 'utf8')).video_url || ''")
          echo "- Review copy: ${url:-not hosted}; full quality in the run's artifact. Not uploaded (series not approved, or dry run)." >> "$GITHUB_STEP_SUMMARY"
          [ "${{ inputs.dry_run }}" = true ] && exit 0
          echo "- $SLUG | review: ${url:-artifact only} (not uploaded: series not approved; made $(TZ=Asia/Kolkata date '+%d %b %H:%M') IST)" >> automation/published.md
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/published.md characters/cast/clips
          git commit -qm "Movie $SLUG rendered for review"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done

      # Festival card links (scripts/festival-links.mjs, e.g. the Janmotsav card 17-20 Nov 2026), only while the page is live.
      - name: Festival links
        if: steps.render.outcome == 'success' && steps.spec.outputs.approved == 'true' && !inputs.dry_run
        continue-on-error: true
        run: node scripts/festival-links.mjs "$F" --day "${{ steps.spec.outputs.release }}" --slot movie

      - name: Claim the upload
        id: claim
        if: steps.render.outcome == 'success' && steps.spec.outputs.approved == 'true' && !inputs.dry_run
        run: node scripts/upload-guard.mjs claim --day "${{ steps.spec.outputs.release }}" --slot movie --slug "$SLUG"

      - name: YouTube (public at 07:00 IST on the release day)
        id: yt
        if: steps.render.outcome == 'success' && steps.spec.outputs.approved == 'true' && !inputs.dry_run && steps.claim.outputs.go == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          node scripts/youtube.mjs upload --video "$W/out/$SLUG.mp4" --scenes "$F" --publish-at "${{ steps.spec.outputs.release }}T${{ steps.spec.outputs.publish_at }}" | tee "$RUNNER_TEMP/yt.json"
          grep -q '"status":"ok"' "$RUNNER_TEMP/yt.json"

      # Facebook: a Page video (parts are over Meta's 90 s Reel limit), scheduled for the same time; Instagram: a Reel
      # queued ("ig: pending") for the `instagram` job, published from the hosted 720p copy.
      - name: Facebook and Instagram (Graph API)
        id: meta
        if: steps.yt.outcome == 'success'
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          [ -n "$META_PAGE_TOKEN" ] || { echo "::notice::META_* secrets not set; YouTube only"; exit 0; }
          grep -q '"duplicate":true' "$RUNNER_TEMP/yt.json" && { echo "::notice::YouTube already had it (earlier run): no second Facebook/Instagram post"; exit 0; }
          # Facebook plan (scripts/fb.mjs): the part goes to Facebook only on a day with a free video slot (07:30 IST).
          fb=$(node scripts/fb.mjs flags --date "${{ steps.spec.outputs.release }}" --slot movie || echo --no-fb)
          node scripts/meta.mjs short --video "$W/out/$SLUG.mp4" --scenes "$F" --video-url "$MEDIA_URL/m/$SLUG.mp4" \
            --publish-at "${{ steps.spec.outputs.release }}T${{ steps.spec.outputs.publish_at }}" $fb | tee "$RUNNER_TEMP/meta.json" || true

      - name: Record
        if: steps.yt.outcome == 'success'
        run: |
          mkdir -p story/published
          cp "$F" "story/published/$SLUG.json"
          rel="${{ steps.spec.outputs.release }}"
          yt=$(node -p "const y=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/yt.json', 'utf8')).youtube; y.url + ' (public at ' + y.publishAt + ')'")
          deity=$(node -p "require('./' + process.env.F).deity"); summary=$(node -p "require('./' + process.env.F).summary")
          echo "$rel | movie | $SLUG | $deity | $summary" >> automation/log.md
          social=$(node -p "try { ' | social: ' + JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/meta.json', 'utf8')).summary } catch { '' }")
          made=$(node -p "const m = require('./' + process.env.W + '/out/meta.json'); m.seconds + ' s, clips ' + m.animated_scenes.length + ', lip-sync ' + m.lip_lines")
          echo "- $SLUG | youtube: $yt | movie part ($made), made $(TZ=Asia/Kolkata date '+%d %b %H:%M') IST$social" >> automation/published.md
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/log.md automation/published.md "story/published/$SLUG.json" characters/cast/clips
          git add automation/movie-series.md story/movies/*/series.json story/movies/*/part-*.json 2>/dev/null || true
          git commit -qm "Movie $SLUG scheduled for $rel 07:00"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done

  # "Kalyug ke Bhagwan" (STORY.md section 8, story/kalyug.py, characters/kalyug/): cute 3D cartoon deities in everyday
  # roles, 30-60 s. With the repo variable KALYUG=on, after every evening-slot run (and alone with slot=kalyug) TOMORROW's
  # episode is made when tomorrow is a Tue/Thu/Sat normal day (scripts/kalyug-due.mjs): Claude writes the spec, edge-tts
  # voices, ONE Kaggle session (sps-kalyug = story/movie_kernel.py: FLUX frames, 2 Wan clips, MuseTalk lip-sync on the
  # library base clips, Whisper check; ~40-45 GPU-min), render, then YouTube private with publishAt <release> 08:00,
  # Facebook scheduled, Instagram queued. It is that day's morning Short ("Movie morning" in the story job). Never starts
  # a Kaggle session in 09:00-11:30 / 18:30-21:00 IST or below the daily Shorts' quota reserve (`story/kalyug.py gate`):
  # the next evening trigger (every 30 min to 23:17 IST) tries again; if none succeeds the morning Short runs as usual.
  kalyug:
    needs: story
    if: always() && needs.story.outputs.kalyug == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    concurrency:
      group: shyam-kalyug
      cancel-in-progress: false
    env:
      FFMPEG_PATH: ffmpeg
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
      MEDIA_URL: https://shyam-premi-media.sk9836413.workers.dev
      MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
      KALYUG: ${{ vars.KALYUG }}
      W: story/kalyug/work
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Due episode
        id: d
        run: |
          git fetch -q origin main && git checkout -q origin/main -- automation/log.md automation/published.md
          node scripts/kalyug-due.mjs --spec "${{ inputs.kalyug_spec }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.d.outputs.mode == 'produce' || steps.d.outputs.mode == 'write'
        with:
          python-version: '3.12'

      - name: Kaggle window and quota
        id: gate
        if: steps.d.outputs.mode == 'produce' || steps.d.outputs.mode == 'write'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          [ "${{ inputs.kaggle_reuse }}" = true ] && { echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; }
          pip install -q 'kaggle>=2.2' six
          node animate/kaggle.mjs quota > "$RUNNER_TEMP/quota.json" || true
          python -I story/kalyug.py gate --quota "$RUNNER_TEMP/quota.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write the episode
        id: write
        if: steps.d.outputs.mode == 'write' && steps.gate.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/validate.mjs:*),Bash(ls:*)"
          prompt: |
            Write the next "Kalyug ke Bhagwan" episode of Shyam Premi SN. Its release day (IST) is ${{ steps.d.outputs.release }} at 08:00.
            Follow automation/STORY.md section 8 exactly (and section 2 for accuracy), with the characters in
            characters/kalyug/cast.json. Lines follow STORY.md "Spoken style" (natural spoken Hindi, short sentences,
            max 18 words). Write story/kalyug/${{ steps.d.outputs.release }}-<topic>.json, make
            `node scripts/validate.mjs <that file>` pass, and change nothing else.

      - name: Spec
        id: spec
        if: steps.gate.outputs.go == 'true' && (steps.d.outputs.mode == 'produce' || steps.write.outcome == 'success')
        run: |
          f="${{ steps.d.outputs.file }}"
          [ -n "$f" ] || f=$(ls story/kalyug/${{ steps.d.outputs.release }}-*.json 2>/dev/null | head -1)
          [ -n "$f" ] && [ -f "$f" ] || { echo "::error::No episode file for ${{ steps.d.outputs.release }}"; exit 1; }
          node scripts/validate.mjs --soft-topics "$f"
          node scripts/kalyug-due.mjs --spec "$f" > "$RUNNER_TEMP/due.json"
          for k in slug release publish_at; do echo "$k=$(node -p "require(process.env.RUNNER_TEMP + '/due.json').$k")" >> "$GITHUB_OUTPUT"; done
          echo "SLUG=$(node -p "require(process.env.RUNNER_TEMP + '/due.json').slug")" >> "$GITHUB_ENV"
          echo "F=$f" >> "$GITHUB_ENV"

      - name: Tools
        if: steps.spec.outcome == 'success'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libfribidi0 libraqm0 > /dev/null
          pip install -q edge-tts pillow kokoro-onnx==0.6.1 soundfile==0.14.0 'kaggle>=2.2' six
          python -c "from PIL import features; print('raqm (Devanagari subtitles):', features.check('raqm'))"

      - name: Voices
        if: steps.spec.outcome == 'success'
        run: python -I story/kalyug.py voice --spec "$F" --out "$W/voice" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Kaggle (frames, clips, lip-sync, pronunciation check)
        id: kaggle
        if: steps.spec.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 130
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: kalyug
        run: |
          [ -n "$KAGGLE_API_TOKEN" ] || { echo "::error::no KAGGLE_API_TOKEN secret"; exit 1; }
          if [ "${{ inputs.kaggle_reuse }}" = true ]; then  # re-render a finished session (e.g. after a renderer fix)
            node animate/kaggle.mjs fetch --to "$W/kaggle" | tee -a "$GITHUB_STEP_SUMMARY"
            node scripts/movie-qa.mjs "$W/kaggle/qa.json" >> "$GITHUB_STEP_SUMMARY" || true
            exit 0
          fi
          python -I story/kalyug.py dataset --spec "$F" --voice "$W/voice" --out animate/dataset --max-minutes 60
          node animate/kaggle.mjs upload
          # A session stuck in QUEUED (sps-char-epifive since 8 Nov) would hold the lock forever: go on after 20 min, Kaggle
          # itself refuses a 3rd session and push retries.
          node animate/kaggle.mjs lock --minutes 20 || echo "::warning::lock: another sps kernel still RUNNING/QUEUED after 20 min; pushing anyway (Kaggle allows 2)"
          node animate/kaggle.mjs push --queue-minutes 20 --retry-minutes 20
          start=$(date +%s)
          node animate/kaggle.mjs wait --minutes 90 --queue-minutes 20 > "$RUNNER_TEMP/wait.json" || echo "::warning::Kaggle: $(cat "$RUNNER_TEMP/wait.json")"
          node animate/kaggle.mjs fetch --to "$W/kaggle" | tee "$RUNNER_TEMP/fetch.json"
          echo "- Kaggle: $(cat "$RUNNER_TEMP/fetch.json"), waited $(( ($(date +%s) - start) / 60 )) min" >> "$GITHUB_STEP_SUMMARY"
          node scripts/movie-qa.mjs "$W/kaggle/qa.json" >> "$GITHUB_STEP_SUMMARY" || true
          ls "$W/kaggle/frames" | grep -q '^s0' || ls "$W/kaggle/clips" | grep -q '^s0' || { echo "::error::Kaggle made no frames"; exit 1; }

      - name: Render
        id: render
        if: steps.kaggle.outcome == 'success'
        run: |
          mkdir -p "$W/out/small"
          python -I story/kalyug.py keep --kaggle "$W/kaggle"
          v="$W/voice"; [ -f "$W/kaggle/voice/voice.json" ] && v="$W/kaggle/voice"
          python -I story/kalyug.py render --spec "$F" --voice "$v" --kaggle "$W/kaggle" --out "$W/out/$SLUG.mp4" \
            --meta "$W/out/meta.json" --srt "$W/out/$SLUG.srt" --small "$W/out/small/$SLUG.mp4" | tee -a "$GITHUB_STEP_SUMMARY"
          ffprobe -v error -show_entries format=duration:stream=width,height -of compact "$W/out/$SLUG.mp4" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the video as an artifact (7 days)
        if: steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kalyug-${{ env.SLUG }}
          path: |
            story/kalyug/work/out/
            story/kalyug/work/kaggle/qa.json
            story/kalyug/work/kaggle/results*.json
          retention-days: 7
          compression-level: 0

      - name: Host
        id: host
        if: steps.render.outcome == 'success'
        run: node scripts/publish.mjs --host-only --video "$W/out/small/$SLUG.mp4" --scenes "$F" | tee "$RUNNER_TEMP/host.json"

      # Festival card links (scripts/festival-links.mjs, e.g. the Janmotsav card 17-20 Nov 2026), only while the page is live.
      - name: Festival links
        if: steps.render.outcome == 'success' && !inputs.dry_run && steps.spec.outputs.release != 'pilot'
        continue-on-error: true
        run: node scripts/festival-links.mjs "$F" --day "${{ steps.spec.outputs.release }}" --slot kalyug

      - name: Claim the upload
        id: claim
        if: steps.render.outcome == 'success' && !inputs.dry_run && steps.spec.outputs.release != 'pilot'
        run: node scripts/upload-guard.mjs claim --day "${{ steps.spec.outputs.release }}" --slot kalyug --slug "$SLUG"

      - name: YouTube (public at 08:00 IST on the release day)
        id: yt
        if: steps.claim.outputs.go == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          node scripts/youtube.mjs upload --video "$W/out/$SLUG.mp4" --scenes "$F" --publish-at "${{ steps.spec.outputs.release }}T${{ steps.spec.outputs.publish_at }}" | tee "$RUNNER_TEMP/yt.json"
          grep -q '"status":"ok"' "$RUNNER_TEMP/yt.json"

      - name: Release the claim after a failed upload
        if: always() && steps.claim.outputs.go == 'true' && steps.yt.outcome != 'success'
        run: node scripts/upload-guard.mjs release --day "${{ steps.spec.outputs.release }}" --slot kalyug --slug "$SLUG" --reason "YouTube ${{ steps.yt.outcome }}"

      - name: Facebook and Instagram (Graph API)
        id: meta
        if: steps.yt.outcome == 'success'
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          [ -n "$META_PAGE_TOKEN" ] || { echo "::notice::META_* secrets not set; YouTube only"; exit 0; }
          grep -q '"duplicate":true' "$RUNNER_TEMP/yt.json" && { echo "::notice::YouTube already had it (earlier run): no second Facebook/Instagram post"; exit 0; }
          # Facebook plan (scripts/fb.mjs): Kalyug ke Bhagwan is not one of the 2 Facebook videos a day: Instagram only.
          node scripts/meta.mjs short --video "$W/out/$SLUG.mp4" --scenes "$F" --video-url "$MEDIA_URL/m/$SLUG.mp4" \
            --publish-at "${{ steps.spec.outputs.release }}T${{ steps.spec.outputs.publish_at }}" --no-fb | tee "$RUNNER_TEMP/meta.json" || true

      - name: Record
        if: steps.yt.outcome == 'success'
        run: |
          mkdir -p story/published
          cp "$F" "story/published/$SLUG.json"
          rel="${{ steps.spec.outputs.release }}"
          yt=$(node -p "const y=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/yt.json', 'utf8')).youtube; y.url + ' (public at ' + y.publishAt + ')'")
          deity=$(node -p "require('./' + process.env.F).deity"); summary=$(node -p "require('./' + process.env.F).summary")
          echo "$rel | kalyug | $SLUG | $deity | $summary" >> automation/log.md
          social=$(node -p "try { ' | social: ' + JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/meta.json', 'utf8')).summary } catch { '' }")
          made=$(node -p "const m = require('./' + process.env.W + '/out/meta.json'); m.seconds + ' s, clips ' + m.animated_scenes.length + ', lip-sync ' + m.lip_lines")
          echo "- $SLUG | youtube: $yt | Kalyug ke Bhagwan ($made), made $(TZ=Asia/Kolkata date '+%d %b %H:%M') IST$social" >> automation/published.md
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/log.md automation/published.md "story/published/$SLUG.json" characters/kalyug/clips "$F"
          git commit -qm "Kalyug ke Bhagwan $SLUG scheduled for $rel 08:00"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done

  # Weekly measurement of the "max 3 uploads a day" change (scripts/growth-compare.mjs -> automation/growth.md): on Monday
  # (IST) morning runs, the average views per Short of 2-8 Nov (before) vs 10-16 Nov and the last 7 days, plus the
  # subscriber change. YouTube Data API, the same credentials as the uploads; a few quota units. Never fails the workflow.
  growth:
    needs: story
    if: always() && needs.story.outputs.long == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    concurrency:
      group: shyam-growth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Weekly growth comparison
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SHYAM_YT_CLIENT_ID: ${{ secrets.SHYAM_YT_CLIENT_ID }}
          SHYAM_YT_CLIENT_SECRET: ${{ secrets.SHYAM_YT_CLIENT_SECRET }}
          SHYAM_YT_REFRESH_TOKEN: ${{ secrets.SHYAM_YT_REFRESH_TOKEN }}
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          [ "$(TZ=Asia/Kolkata date +%u)" = 1 ] || { echo "Not Monday (IST): nothing to do"; exit 0; }
          grep -q "^## Week of $today" automation/growth.md 2>/dev/null && { echo "Already written today"; exit 0; }
          node scripts/growth-compare.mjs --date "$today" | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/growth.md && git commit -qm "Growth comparison $today"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i * 10)); done

  # Instagram has no scheduled publishing: queued Reels ("ig: pending <time>" in automation/published.md, written for the
  # evening and festival status Shorts) are published here within 20 minutes of their time (see the header). Runs on every
  # trigger beside the other jobs, takes seconds when nothing is due, and never fails the workflow.
  instagram:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: shyam-instagram-queue
      cancel-in-progress: false
    env:
      MEDIA_URL: https://shyam-premi-media.sk9836413.workers.dev
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish queued Instagram Reels
        continue-on-error: true
        run: |
          [ -n "$META_PAGE_TOKEN" ] || { echo "::notice::META_* secrets not set"; exit 0; }
          node scripts/meta.mjs flush | tee "$RUNNER_TEMP/flush.json" || echo "::warning::An Instagram Reel failed; see the result (retried once on the next run)."
          git diff --quiet -- automation/published.md && exit 0
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/published.md
          git commit -qm "Instagram queue"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
