# Shyam Premi SN card site (site/): plain HTML, CSS and JS with no build step, published to GitHub Pages
# (https://sk9836413.github.io/shyam-premi-sn/). Runs only when site/ or this file changes, or by hand; no schedule.
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the site
        run: |
          set -e
          for f in site/index.html site/janmotsav/index.html site/diwali/index.html site/diwali/en/index.html; do test -s "$f"; done
          for f in site/js/*.js; do node --check "$f"; done
          if grep -rniE 'epifive' site; then echo "site/ must not mention EpiFive"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
