# Owner footage lane (owner, 20 Nov 2026: "tum upload kardo, daily upload me daal do"; scripts/owner-footage.mjs,
# automation/owner-footage.json): the owner's own REAL darshan reels from a Khatu Shyam ji pandal, ONE a day as an EXTRA
# Short (upload-guard slot `owner`, its own cap of 1, outside the 3 Shorts), public at the plan's time (09:30 IST) on
# YouTube (publishAt), Facebook (scheduled, fb.mjs spacing) and Instagram (queued; daily.yml's `instagram` job flushes it).
# The reels (music already mixed in) are assets of the GitHub release named in the plan, never in git history.
# No cron of its own: daily.yml calls it after every evening-slot run (tomorrow's reel, uploaded the evening before) and
# every morning-slot run (today's, only if last evening's is missing). workflow_dispatch: a date, or publish at once.
# Skip list: automation/owner-footage-skip.txt. Also posts the owner's photo carousel (Instagram) when it is due.
name: Owner footage

on:
  workflow_call:
    inputs:
      day: { type: string, default: '' }
      now: { type: boolean, default: false }
      dry_run: { type: boolean, default: false }
  workflow_dispatch:
    inputs:
      day:
        description: IST date YYYY-MM-DD (empty = tomorrow from 17:00 IST, else today)
        required: false
        default: ''
      now:
        description: Publish at once instead of the plan's time (the owner's "abhi 1 post kardo")
        type: boolean
        default: false
      dry_run:
        description: Pick the clip and show the texts, upload nothing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  owner:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: shyam-owner-footage
      cancel-in-progress: false
    env:
      MEDIA_URL: https://shyam-premi-media.sk9836413.workers.dev
      MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      W: story/owner/work
      DRY: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Which clip
        id: next
        run: |
          day="${{ inputs.day }}"
          if [ -z "$day" ]; then
            if [ $((10#$(TZ=Asia/Kolkata date +%H))) -ge 17 ]; then day=$(TZ=Asia/Kolkata date -d tomorrow +%F); else day=$(TZ=Asia/Kolkata date +%F); fi
          fi
          rel=$(node -p "require('./automation/owner-footage.json').release")
          assets=$(gh release view "$rel" --json assets -q '.assets[].name' | paste -sd, -)
          echo "REL=$rel" >> "$GITHUB_ENV"; echo "DAY=$day" >> "$GITHUB_ENV"
          node scripts/owner-footage.mjs next --day "$day" --assets "$assets" | tee "$RUNNER_TEMP/next.json"
          go=$(node -p "require('$RUNNER_TEMP/next.json').go === true")
          echo "go=$go" >> "$GITHUB_OUTPUT"
          [ "$go" = true ] || { echo "::notice::No owner-footage Short for $day: $(node -p "require('$RUNNER_TEMP/next.json').reason")"; exit 0; }
          for k in clip slug asset; do echo "$(echo $k | tr a-z A-Z)=$(node -p "require('$RUNNER_TEMP/next.json').$k")" >> "$GITHUB_ENV"; done
          at=$(node -p "require('$RUNNER_TEMP/next.json').publish_at || ''")
          [ "${{ inputs.now }}" = true ] && at=""
          echo "AT=$at" >> "$GITHUB_ENV"

      - name: Download, spec
        if: steps.next.outputs.go == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p "$W/out"
          gh release download "$REL" -p "$ASSET" -D "$W" --clobber
          mv "$W/$ASSET" "$W/out/$SLUG.mp4"
          node scripts/owner-footage.mjs spec --clip "$CLIP" --day "$DAY" --out "$W/scenes.json" | tee "$RUNNER_TEMP/spec.json"
          echo "- Owner footage $SLUG: clip $CLIP, $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$W/out/$SLUG.mp4") s, music $(node -p "require('./$W/scenes.json').music.id"), AI flags $(node -p "JSON.stringify(require('$RUNNER_TEMP/spec.json').ai)"), public ${AT:-now} IST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload (guard, YouTube, Facebook, Instagram) and record
        if: steps.next.outputs.go == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          file="$W/scenes.json"; video="$W/out/$SLUG.mp4"
          j() { node -p "try{const j=JSON.parse(require('fs').readFileSync('$1','utf8'));$2}catch{''}"; }
          pa=(); [ -n "$AT" ] && pa=(--publish-at "$AT")
          if [ "$DRY" = true ]; then
            node scripts/youtube.mjs upload --video "$video" --scenes "$file" "${pa[@]}" --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
            node scripts/meta.mjs short --video "$video" --scenes "$file" "${pa[@]}" --dry-run | tee -a "$GITHUB_STEP_SUMMARY" || true
            exit 0
          fi
          node scripts/publish.mjs --host-only --video "$video" --scenes "$file" > "$RUNNER_TEMP/host.json" || true
          url=$(j "$RUNNER_TEMP/host.json" "j.video_url||''")
          [ -n "$url" ] || echo "::warning::media upload failed ($(head -c 200 "$RUNNER_TEMP/host.json")): no queued Instagram Reel"
          node scripts/upload-guard.mjs claim --day "$DAY" --slot owner --slug "$SLUG" > "$RUNNER_TEMP/claim.json"
          grep -q '"go":true' "$RUNNER_TEMP/claim.json" || { echo "::notice::$SLUG not uploaded: $(head -c 300 "$RUNNER_TEMP/claim.json")"; exit 0; }
          if ! node scripts/youtube.mjs upload --video "$video" --scenes "$file" "${pa[@]}" > "$RUNNER_TEMP/yt.json" || ! grep -q '"status":"ok"' "$RUNNER_TEMP/yt.json"; then
            echo "::error::YouTube upload failed: $(head -c 300 "$RUNNER_TEMP/yt.json")"
            node scripts/upload-guard.mjs release --day "$DAY" --slot owner --slug "$SLUG" --reason "YouTube upload failed"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/meta.json"
          if [ -n "$META_PAGE_TOKEN" ] && ! grep -q '"duplicate":true' "$RUNNER_TEMP/yt.json"; then
            fb=$(node scripts/fb.mjs flags --date "$DAY" --slot owner --at "$(node -p "require('./automation/owner-footage.json').at")" || echo --no-fb)
            [ -z "$AT" ] && fb=$(node scripts/fb.mjs flags --date "$DAY" --slot owner --at "$(TZ=Asia/Kolkata date +%H:%M)" || echo --no-fb)
            node scripts/meta.mjs short --video "$video" --scenes "$file" ${url:+--video-url "$url"} "${pa[@]}" $fb > "$RUNNER_TEMP/meta.json" || true
          fi
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p story/published
          cp "$file" "story/published/$SLUG.json"
          yt=$(j "$RUNNER_TEMP/yt.json" "const y=j.youtube; y.url+(y.publishAt?' (public at '+y.publishAt+')':' (public now)')")
          social=$(j "$RUNNER_TEMP/meta.json" "' | social: '+j.summary")
          ai=$(j "$RUNNER_TEMP/spec.json" "'YouTube synthetic '+j.ai.youtube+', Meta AI label '+j.ai.meta")
          echo "$DAY | owner | $SLUG | Khatu Shyam ji (owner's own pandal darshan footage) | owner-footage Short, clip $CLIP \"$(j "$file" "j.youtube_title.split(' | ')[0]")\", real footage + music $(j "$file" "j.music.id") ($ai), public ${AT:-on upload} IST" >> automation/log.md
          echo "- $SLUG | youtube: $yt | owner-footage Short (clip $CLIP, real footage), made $(TZ=Asia/Kolkata date '+%d %b %H:%M') IST$social" >> automation/published.md
          git add automation/log.md automation/published.md "story/published/$SLUG.json"
          git commit -qm "Owner footage Short $SLUG"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i * 10)); done
          echo "- uploaded: $yt$social" >> "$GITHUB_STEP_SUMMARY"

      - name: Owner photo carousel (Instagram, when due)
        if: always() && !inputs.dry_run
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          node scripts/owner-footage.mjs photos --check | tee "$RUNNER_TEMP/ph.json"
          grep -q '"status":"due"' "$RUNNER_TEMP/ph.json" || exit 0
          rel=$(node -p "require('./automation/owner-footage.json').release")
          export OWNER_PHOTOS_DIR="$RUNNER_TEMP/owner-photos"; mkdir -p "$OWNER_PHOTOS_DIR"
          gh release download "$rel" -p 'post-*.jpg' -D "$OWNER_PHOTOS_DIR" --clobber
          node scripts/owner-footage.mjs photos | tee "$RUNNER_TEMP/ph.json"
          [ -n "$(git status --porcelain automation/photos)" ] || exit 0
          git config user.name "shyam-premi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/photos
          git commit -qm "Owner photo carousel"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i * 10)); done
