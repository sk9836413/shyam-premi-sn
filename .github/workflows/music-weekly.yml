# Weekly music for the library (ACE-Step 1.5, MIT, on Kaggle's free T4; the repo variable MUSIC_GEN picks what the
# Monday 02:10 IST run makes):
#   MUSIC_GEN=vocals  AI-sung bhajans (job `bhajan`, owner 13 Nov 2026: "1 no h" for the ZWJ take): music/bhajan-batch.mjs
#                     plans ~13 songs for the coming week (Khatu Shyam most, then Mahadev/Bhole, Hanuman/Salasar Balaji,
#                     Krishna, Ganesh + the week's festivals; moods thaath / bhaavuk), Claude writes ORIGINAL lyrics
#                     (validated: chorus first, deity name in a checkable position, no existing bhajan lines, no Rani Sati),
#                     3 takes per song (music/kaggle/bhajan_batch.py, ~45-55 GPU min), the QA gate keeps the best take
#                     per song or none, winners -> music/library/bhajan-*.ogg (+ licence JSON). Used in the videos only
#                     with BHAJAN_VOCALS=on (music/bhajan.mjs).
#   MUSIC_GEN=on      instrumental batch (job `batch`, as before, ~15-25 GPU min).
#   MUSIC_GEN=both    both, one after the other (they share the sps-music kernel).
# Mantra jaap (job `mantra`, owner 13 Nov 2026; music/mantra-takes.mjs): every Monday run, after the above, also makes
# the ACE-Step takes of the coming week's mantra-jaap long video (one per mala; repo variable MANTRA_JAAP=off stops it);
# the first video's takes once on Sat 21 Nov 2026 05:45 IST (cron '15 0 21 11 *', guarded to 2026 only).
# Kaggle rules (music/gen.mjs push): never inside or running into 09:00-11:30 / 18:30-21:00 IST, waits up to 60 min for
# any other sps-* GPU kernel (lock), refuses under 8 GPU-hours left this week (the quota resets Sat 05:30 IST).
# First bhajan batch: one run on Sat 14 Nov 2026 06:00 IST, right after the weekly quota reset (cron '30 0 14 11 *',
# guarded to 2026 only), so the videos can use bhajans that weekend.
# Resume (mode=import, job `import`; 14 Nov 2026: bhajan-2026w46's session sat QUEUED past the Wait step, finished later
# and was never imported): for a batch whose music/lyrics/<batch>.batch.json is in the repo, `gen.mjs verify` checks that
# the sps-music kernel's latest version runs exactly that batch, waits (up to 60 min) if it is still going, then fetch ->
# QA gate -> import -> licence gate + tests -> commit. It never pushes a Kaggle session (no GPU time).
#   gh workflow run music-weekly.yml -R sk9836413/shyam-premi-sn -f mode=import -f batch=bhajan-2026w46
name: Music weekly batch

on:
  schedule:
    - cron: '40 20 * * 0'   # Monday 02:10 IST
    - cron: '30 0 14 11 *'  # once: Sat 14 Nov 2026 06:00 IST, first bhajan batch (the job skips in other years)
    - cron: '15 0 21 11 *'  # once: Sat 21 Nov 2026 05:45 IST, takes of the first mantra video (Sun 22 Nov; job `mantra`)
  workflow_dispatch:
    inputs:
      mode:
        description: vocals (AI bhajans), instrumental, mantra (the mantra-jaap takes of the next 7 days), or import (resume a finished bhajan session; no Kaggle push)
        type: choice
        options: [vocals, instrumental, mantra, import]
        default: vocals
      from:
        description: First day the bhajans are for (YYYY-MM-DD, IST; mantra mode - the day the next 7 days count from); empty = today
        type: string
        default: ''
      batch:
        description: mode import only - the bhajan batch (e.g. bhajan-2026w46); music/lyrics/<batch>.batch.json must be in the repo
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: music-weekly
  cancel-in-progress: false

jobs:
  bhajan:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'vocals') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 0 14 11 *') ||
      (github.event_name == 'schedule' && github.event.schedule == '40 20 * * 0' && (vars.MUSIC_GEN == 'vocals' || vars.MUSIC_GEN == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    defaults:
      run:
        shell: bash  # = bash -eo pipefail: a failing import before `| tee` fails the step (14 Nov 2026 it was hidden)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan the week
        id: plan
        run: |
          if [ "${{ github.event.schedule }}" = '30 0 14 11 *' ] && [ "$(date -u +%Y)" != 2026 ]; then echo "one-off first batch: not this year"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          from="${{ inputs.from }}"; [ -n "$from" ] || from=$(TZ=Asia/Kolkata date +%F)
          node music/bhajan-batch.mjs plan --from "$from" --out "$RUNNER_TEMP/plan.json" | tee -a "$GITHUB_STEP_SUMMARY"
          batch=$(node -p "require('$RUNNER_TEMP/plan.json').batch")
          # A late schedule must not make the same week again (14 Nov 2026: the 06:00 IST one-off fired at 12:23 IST,
          # after a manual run had already made bhajan-2026w46, and its push replaced that session's output).
          if [ "${{ github.event_name }}" = schedule ] && [ -f "music/lyrics/$batch.batch.json" ]; then
            echo "$batch was already made (music/lyrics/$batch.batch.json): skip. Re-make it with a manual vocals run, or import a finished session with mode=import." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cp "$RUNNER_TEMP/plan.json" "music/lyrics/$batch.plan.json"
          echo "batch=$batch" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Claude writes the lyrics
        if: steps.plan.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node music/bhajan-batch.mjs validate:*)"
          prompt: |
            Write the lyrics of this week's ORIGINAL Hindi bhajans for the Shyam Premi SN channel (AI-sung by ACE-Step).
            The plan is music/lyrics/${{ steps.plan.outputs.batch }}.plan.json: one song per slot, with its deity, mood,
            festival (or null) and bpm (and sometimes a "subject": the song's theme, follow it). Write music/lyrics/${{ steps.plan.outputs.batch }}.json as
            {"batch": "${{ steps.plan.outputs.batch }}", "songs": [{"slot", "deity", "mood", "festival", "title_hi", "title_roman",
            "lyrics", "public_domain_text"}]} with deity / mood / festival copied from the plan slot, then run
            `node music/bhajan-batch.mjs validate music/lyrics/${{ steps.plan.outputs.batch }}.json --plan music/lyrics/${{ steps.plan.outputs.batch }}.plan.json`
            and fix every problem it lists until all songs pass. Change no other file.
            Rules:
            - ALL lyrics are your own new words. Never use or lightly change a line of any existing bhajan, film song or
              singer's song (Kanhaiya Mittal style is only a mood reference: simple, heartfelt, singable; Rajasthani /
              Hindi bhakti words like सांवरा, धणी, लखदातार, शीश के दानी, हारे का सहारा, नीले का सवार are fine).
              public_domain_text: null, unless the song quotes a public-domain text (Tulsidas's Hanuman Chalisa, "Om Jai
              Jagdish Hare" by Shardha Ram Phillauri, Vedic mantras): then name the text there.
            - Devanagari only, plain spelling (no ZWJ or special characters; numbers as words). The script adds the singing
              spellings itself.
            - Shape: [chorus] FIRST (2-4 short lines, the hook), then [verse] (2-4 lines), then [chorus] again; optionally
              a second [verse] + [chorus]. 6-16 sung lines in total, each 6-48 characters, easy to sing.
            - The chorus must name the deity at least once NOT right after "श्री" (Whisper cannot check "श्री श्याम"):
              Khatu Shyam: "श्याम", e.g. "खाटू वाले श्याम", "मेरे श्याम", "श्याम धणी"; Mahadev: "भोले" / "शिव" / "महादेव" /
              "शंकर"; Hanuman: "हनुमान" / "बालाजी" / "बजरंग"; Krishna: "कान्हा" / "कृष्ण" / "गोविंद"; Ganesh: "गणपति" / "गणेश";
              devi (Chhath): "छठी" (छठी मइया); vishnu (Tulsi Vivah): "तुलसी" / "नारायण".
            - Mood "thaath": dhol/DJ bhajan-sandhya energy, celebration, jaikaras, call and response. Mood "bhaavuk":
              emotional, the haara-hua bhakt who finds strength in the deity, tender and hopeful.
            - Khatu Shyam ji is the sheesh (head) only: no flute / murli / bansuri in Khatu songs. Krishna songs may
              mention the flute.
            - Never write about Rani Sati / sati in any form. No fear, threats, miracles-for-money or "share this" lines.
            - Every chorus first line must differ from the others and from plan.avoid_first_lines.
            - title_roman: plain ASCII Hinglish title (e.g. "Khatu Wale Shyam Dhani"); title_hi: the Devanagari title.

      - name: Kaggle jobs
        if: steps.plan.outputs.skip != 'true'
        run: |
          B=${{ steps.plan.outputs.batch }}
          node music/bhajan-batch.mjs batch --plan "music/lyrics/$B.plan.json" --lyrics "music/lyrics/$B.json" --out "music/lyrics/$B.batch.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Kaggle CLI and ffmpeg
        if: steps.plan.outputs.skip != 'true'
        run: |
          pip install -q 'kaggle>=2.2' six
          # the import's loudness pass needs ffmpeg (not on the runner image: 14 Nov 2026 "loudness probe failed")
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Push the Kaggle session
        if: steps.plan.outputs.skip != 'true'
        run: node music/gen.mjs push --batch "music/lyrics/${{ steps.plan.outputs.batch }}.batch.json" --code music/kaggle/bhajan_batch.py --push-dir "$RUNNER_TEMP/push" --lock-minutes 60 --needs-minutes 60 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait
        if: steps.plan.outputs.skip != 'true'
        run: |
          # Kaggle's own queue gets its own budget (90 min), the run 60 min from its first RUNNING. Still queued / running
          # at the end = exit 2: the batch JSON is committed below, import the finished session later with mode=import.
          rc=0; node music/gen.mjs wait --minutes 60 --queue-minutes 90 || rc=$?
          if [ "$rc" = 2 ]; then
            echo "Kaggle session not finished yet: once it is, run \`gh workflow run music-weekly.yml -R ${{ github.repository }} -f mode=import -f batch=${{ steps.plan.outputs.batch }}\`" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
      - name: Fetch, QA gate and import
        if: steps.plan.outputs.skip != 'true'
        run: |
          B=${{ steps.plan.outputs.batch }}
          node music/gen.mjs fetch --to "$RUNNER_TEMP/out"
          node music/bhajan-batch.mjs import --from "$RUNNER_TEMP/out" --batch "music/lyrics/$B.batch.json" --report "music/lyrics/$B.qa.json" | tee -a "$GITHUB_STEP_SUMMARY"
          node music/weekly.mjs prune --prefix bhajan- --keep 80
          rm -rf "$RUNNER_TEMP/out"
      - name: Licence gate and tests
        if: steps.plan.outputs.skip != 'true'
        run: node music/check-licences.mjs && node --test music/engine.test.mjs music/bhajan.test.mjs
      - name: Commit
        if: always() && steps.plan.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          B=${{ steps.plan.outputs.batch }}
          node music/check-licences.mjs > /dev/null || { git checkout -- music/library; git clean -fdq music/library; }
          git add music/library
          for f in "music/lyrics/$B.json" "music/lyrics/$B.plan.json" "music/lyrics/$B.batch.json" "music/lyrics/$B.qa.json"; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -qm "Music library: AI bhajans $B"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done

  # Resume a bhajan batch whose Kaggle session finished after the `bhajan` job gave up (see the header). No push, no GPU.
  import:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'import'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      B: ${{ inputs.batch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The batch
        run: |
          [[ "$B" =~ ^bhajan-[0-9]{4}w[0-9]{2}[a-z0-9-]*$ ]] || { echo "input batch like bhajan-2026w46 needed (got '$B')"; exit 1; }
          [ -f "music/lyrics/$B.batch.json" ] || { echo "music/lyrics/$B.batch.json is not in the repo"; exit 1; }
      - name: Kaggle CLI and ffmpeg
        run: |
          pip install -q 'kaggle>=2.2' six
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: The kernel ran this batch, and has finished
        run: |
          node music/gen.mjs verify --batch "music/lyrics/$B.batch.json" | tee -a "$GITHUB_STEP_SUMMARY"
          node music/gen.mjs wait --now --minutes 60 --queue-minutes 60
      - name: Fetch, QA gate and import
        run: |
          node music/gen.mjs fetch --to "$RUNNER_TEMP/out"
          node music/bhajan-batch.mjs import --from "$RUNNER_TEMP/out" --batch "music/lyrics/$B.batch.json" --report "music/lyrics/$B.qa.json" | tee -a "$GITHUB_STEP_SUMMARY"
          node music/weekly.mjs prune --prefix bhajan- --keep 80
          rm -rf "$RUNNER_TEMP/out"
      - name: Licence gate and tests
        run: node music/check-licences.mjs && node --test music/engine.test.mjs music/bhajan.test.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/library "music/lyrics/$B.qa.json"
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -qm "Music library: AI bhajans $B (resumed import)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done

  batch:
    needs: bhajan
    if: >-
      always() && (
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'instrumental') ||
      (github.event_name == 'schedule' && github.event.schedule == '40 20 * * 0' && (vars.MUSIC_GEN == 'on' || vars.MUSIC_GEN == 'both')))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kaggle CLI
        run: pip install -q 'kaggle>=2.2' six
      - name: Batch
        run: node music/weekly.mjs batch --out "$RUNNER_TEMP/batch.json"
      - name: Push the Kaggle session
        run: node music/gen.mjs push --batch "$RUNNER_TEMP/batch.json" --push-dir "$RUNNER_TEMP/push" --lock-minutes 60 --needs-minutes 45
      - name: Wait
        run: node music/gen.mjs wait --minutes 55
      - name: Fetch and import
        run: |
          node music/gen.mjs fetch --to "$RUNNER_TEMP/out"
          node music/gen.mjs import --from "$RUNNER_TEMP/out" --batch "$RUNNER_TEMP/batch.json" | tee -a "$GITHUB_STEP_SUMMARY"
          node music/weekly.mjs prune --keep 48
      - name: Licence gate
        run: node music/check-licences.mjs && node --test music/engine.test.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/library
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -qm "Music library: weekly batch $(date -u +%G-W%V)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done

  # Weekly mantra-jaap takes (owner, 13 Nov 2026; music/mantra-takes.mjs, automation/mantras.json): the ACE-Step takes of
  # the mantra video(s) of the next 7 days (one take per mala + 2 spares, a different raag / tempo / instruments each;
  # 3 malas + 1 spare when under 12 GPU hours are left), in the same sps-music kernel after the bhajans (~25-40 GPU min).
  # Whisper deity-name gate + CLAP + a steady 108-divisor loop per take; passing takes -> music/mantra/takes/ + the
  # ledger music/mantra/takes.json (never reused). Mondays 02:10 IST (repo variable MANTRA_JAAP=off stops it), and once on
  # Sat 21 Nov 2026 05:45 IST for the first video (Sun 22 Nov): after the movie series' GPU days (17-20 Nov), right after
  # the weekly quota reset (Sat 05:30 IST), done before the 09:00 IST blocked window. gen.mjs push keeps the rules: no
  # session in or into 09:00-11:30 / 18:30-21:00 IST, waits for the Kaggle lock, refuses under --min-hours.
  mantra:
    needs: bhajan
    if: >-
      always() && (
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'mantra') ||
      (github.event_name == 'schedule' && github.event.schedule == '15 0 21 11 *') ||
      (github.event_name == 'schedule' && github.event.schedule == '40 20 * * 0' && vars.MANTRA_JAAP != 'off'))
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools (Kaggle CLI, ffmpeg)
        run: |
          pip install -q 'kaggle>=2.2' six
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Plan the takes
        id: plan
        run: |
          if [ "${{ github.event.schedule }}" = '15 0 21 11 *' ] && [ "$(date -u +%Y)" != 2026 ]; then echo "one-off first mantra takes: not this year"; echo "need=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          today="${{ inputs.from }}"; [ -n "$today" ] || today=$(TZ=Asia/Kolkata date +%F)
          left=$(node animate/kaggle.mjs quota 2>/dev/null | tail -1 | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).left??'')}catch{console.log('')}})")
          echo "GPU hours left this week: ${left:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          node music/mantra-takes.mjs plan --today "$today" ${left:+--hours-left "$left"} --out "$RUNNER_TEMP/mantra-batch.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push the Kaggle session
        if: steps.plan.outputs.need == 'true'
        run: |
          B=${{ steps.plan.outputs.batch }}
          mkdir -p music/mantra/batches
          cp "$RUNNER_TEMP/mantra-batch.json" "music/mantra/batches/$B.batch.json"
          node music/gen.mjs push --batch "music/mantra/batches/$B.batch.json" --code music/kaggle/bhajan_batch.py --push-dir "$RUNNER_TEMP/push" --lock-minutes 60 --needs-minutes 50 --min-hours 3 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait
        if: steps.plan.outputs.need == 'true'
        run: node music/gen.mjs wait --minutes 65
      - name: Fetch, Whisper gate, loops and import
        if: steps.plan.outputs.need == 'true'
        run: |
          B=${{ steps.plan.outputs.batch }}
          node music/gen.mjs fetch --to "$RUNNER_TEMP/out"
          node music/mantra-takes.mjs import --from "$RUNNER_TEMP/out" --batch "music/mantra/batches/$B.batch.json" --report "music/mantra/batches/$B.qa.json" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf "$RUNNER_TEMP/out"
      - name: Tests
        if: steps.plan.outputs.need == 'true'
        run: node --test scripts/mantra.test.mjs
      - name: Commit
        if: always() && steps.plan.outputs.need == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A music/mantra
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -qm "Mantra takes ${{ steps.plan.outputs.batch }}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
