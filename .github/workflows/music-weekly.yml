# Weekly original instrumentals for the music library (music/weekly.mjs + music/gen.mjs, ACE-Step 1.5 MIT on Kaggle).
# Runs only with the repo variable MUSIC_GEN=on. Monday 02:10 IST, outside the no-extra-Kaggle windows (09:00-11:30,
# 18:30-21:00 IST); gen.mjs also waits for any other sps-* GPU kernel and refuses under 8 GPU-hours left. One T4
# session of ~15-25 min. Tracks that pass QA (duration, loudness, true peak, clipping) are added with a licence JSON,
# the library keeps the newest 48 generated tracks, and the licence gate must pass before anything is committed.
name: Music weekly batch

on:
  schedule:
    - cron: '40 20 * * 0'   # Monday 02:10 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-weekly
  cancel-in-progress: false

jobs:
  batch:
    if: vars.MUSIC_GEN == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kaggle CLI
        run: pip install -q 'kaggle>=2.2' six
      - name: Batch
        run: node music/weekly.mjs batch --out "$RUNNER_TEMP/batch.json"
      - name: Push the Kaggle session
        run: node music/gen.mjs push --batch "$RUNNER_TEMP/batch.json" --push-dir "$RUNNER_TEMP/push" --lock-minutes 60
      - name: Wait
        run: node music/gen.mjs wait --minutes 55
      - name: Fetch and import
        run: |
          node music/gen.mjs fetch --to "$RUNNER_TEMP/out"
          node music/gen.mjs import --from "$RUNNER_TEMP/out" --batch "$RUNNER_TEMP/batch.json" ${{ vars.MUSIC_VOCALS == 'on' && '--vocals' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
          node music/weekly.mjs prune --keep 48
      - name: Licence gate
        run: node music/check-licences.mjs && node --test music/engine.test.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/library
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -qm "Music library: weekly batch $(date -u +%G-W%V)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
